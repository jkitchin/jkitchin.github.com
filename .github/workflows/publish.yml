name: Publish site

on:
  push:
    branches: [modern-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the build scripts need. Post code is never executed here:
      # its results are committed in _freeze/ (qmd) or stored in the notebook (ipynb).
      - run: pip install pyyaml lxml jupyter

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render (pre-render builds partials; post-render merges legacy/ and feeds)
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
