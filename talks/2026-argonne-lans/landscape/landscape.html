<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Differentiable Optimization Landscape</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1b1f3b;
    --muted: #5d6280;
    --rule: #d9dcea;
    --card: #ffffff;
    --card-edge: #c9cde0;
    --plate: #ffffff;
    --prog: #2f6fde;        /* programs (difflow) */
    --prog-soft: #e6eefc;
    --solv: #c2410c;        /* solvers */
    --solv-soft: #fdeee4;
    --eq: #6d28d9;          /* equations (discopt) */
    --eq-1: #ede7fb;
    --eq-2: #f5f1fd;
    --eq-3: #fbf9ff;
    --surr: #0f766e;        /* surrogates */
    --surr-soft: #e3f4f1;
    --tip-bg: #ffffff;
    --tip-shadow: 0 6px 24px rgba(20, 24, 60, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131c; --ink: #e8e9f3; --muted: #a2a6c2; --rule: #2e3146;
      --card: #1c1e2c; --card-edge: #393c56; --plate: #f4f5fa;
      --prog: #7aa7ff; --prog-soft: #1b2440;
      --solv: #fb923c; --solv-soft: #2f2016;
      --eq: #b197fc; --eq-1: #2a2244; --eq-2: #221c37; --eq-3: #1b1729;
      --surr: #4fd1c5; --surr-soft: #13302d;
      --tip-bg: #1f2130; --tip-shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131c; --ink: #e8e9f3; --muted: #a2a6c2; --rule: #2e3146;
    --card: #1c1e2c; --card-edge: #393c56; --plate: #f4f5fa;
    --prog: #7aa7ff; --prog-soft: #1b2440;
    --solv: #fb923c; --solv-soft: #2f2016;
    --eq: #b197fc; --eq-1: #2a2244; --eq-2: #221c37; --eq-3: #1b1729;
    --surr: #4fd1c5; --surr-soft: #13302d;
    --tip-bg: #1f2130; --tip-shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { position: relative; max-width: 1320px; margin: 0 auto; padding: 8px 16px 16px; }
  svg { display: block; width: 100%; height: auto; }

  svg text { fill: var(--ink); font-family: inherit; }
  .h { font-size: 30px; font-weight: 700; letter-spacing: .01em; }
  .sub { font-size: 14px; fill: var(--muted); }
  .lbl { font-size: 12.5px; fill: var(--muted); }
  .lbl-sm { font-size: 11px; fill: var(--muted); }
  .name { font-size: 16px; font-weight: 650; }
  .cls { font-size: 12px; fill: var(--muted); }

  .node { cursor: pointer; outline: none; transition: opacity .15s; }
  .node .tile { fill: var(--plate); stroke: var(--card-edge); stroke-width: 1.2; }
  .node .card { fill: var(--card); stroke: var(--card-edge); stroke-width: 1.2; }
  .node:hover .tile, .node:hover .card, .node:focus-visible .tile, .node:focus-visible .card,
  .node.active .tile, .node.active .card { stroke: var(--ink); stroke-width: 2; }
  .pill { stroke-width: 1.2; }
  .pill-txt { font-size: 13px; font-weight: 650; text-anchor: middle; }

  .edge { fill: none; stroke-width: 2; transition: opacity .15s; }
  .edge.dash { stroke-dasharray: 7 5; }
  .edge.dot { stroke-dasharray: 2 5; stroke-linecap: round; }
  .elbl { font-size: 12px; font-style: italic; transition: opacity .15s; }
  .spoke { stroke: var(--prog); stroke-width: 2; opacity: .55; }

  svg.focus .node:not(.lit), svg.focus .edge:not(.lit), svg.focus .elbl:not(.lit),
  svg.focus .spoke:not(.lit) { opacity: .18; }

  .tip {
    position: absolute; z-index: 5; width: 290px; max-width: calc(100% - 32px);
    background: var(--tip-bg); color: var(--ink); border: 1px solid var(--card-edge);
    border-radius: 10px; box-shadow: var(--tip-shadow); padding: 12px 14px;
    font-size: 14px; display: none;
  }
  .tip.show { display: block; }
  .tip .t-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .tip img { width: 36px; height: 36px; object-fit: contain; background: var(--plate); border-radius: 7px; padding: 2px; }
  .tip .t-name { font-weight: 700; font-size: 15px; }
  .tip .t-kind { font-size: 12px; color: var(--muted); }
  .tip p { margin: 0 0 8px; }
  .tip .t-links a { color: var(--prog); margin-right: 12px; font-weight: 600; text-decoration: none; }
  .tip .t-links a:hover { text-decoration: underline; }
  .tip .t-note { font-size: 12px; color: var(--muted); }
  .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <svg id="map" viewBox="0 0 1320 880" role="img"
       aria-labelledby="map-title map-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="map-title">The differentiable optimization landscape</title>
    <desc id="map-desc">Programs on the left (difflow and its plugins, solved with JAX solvers),
      differentiable solvers in the middle (feral, pounce, discopt, jax-go), equations on the right
      (the discopt modeling language, its modules and plugins), and differentiable surrogates with
      uncertainty quantification along the bottom, feeding both sides.</desc>
    <defs>
      <marker id="arr-prog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--prog)"/></marker>
      <marker id="arr-solv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--solv)"/></marker>
      <marker id="arr-eq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--eq)"/></marker>
      <marker id="arr-surr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--surr)"/></marker>
    </defs>
    <g id="bg"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
  </svg>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="hint">Hover or tap an icon for details and links.</div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const GH = r => `https://github.com/${r}`;
  const SITE = 'https://kitchingroup.cheme.cmu.edu';
  const DF_DOCS = `${SITE}/differentiable-flowsheets/docs`;
  const DISCOPT = 'jkitchin/discopt';

  // ---------- geometry ----------
  const HUB = { x: 190, y: 360 };                 // difflow
  const ARCH = { x: 1060, y: 530, r0: 82, r1: 160, r2: 245 };  // discopt rings
  const SOLV_X = 640;
  const polar = (c, r, deg) => ({ x: c.x + r * Math.cos(deg * Math.PI / 180),
                                  y: c.y - r * Math.sin(deg * Math.PI / 180) });

  // ---------- nodes ----------
  // kind: tile (square icon), card (solver card), pill (text chip), core (arch core)
  // When a deck build inlines this page as an iframe srcdoc, relative URLs resolve
  // against the deck, so point them back at this folder.
  const HERE = location.protocol === 'about:' ? new URL('landscape/', document.baseURI) : location.href;
  const asset = p => new URL(p, HERE).href;

  const N = [];
  const add = n => (n.icon && (n.icon = asset(n.icon)), N.push(n), n);

  add({ id: 'difflow', kind: 'tile', size: 84, ...HUB, icon: 'icons/difflow.svg', name: 'difflow',
        group: 'prog', label: 'difflow',
        type: 'Differentiable flowsheets',
        blurb: 'Process models written as ordinary Python + JAX programs. Unit operations compose into flowsheets with recycles, and every output is differentiable with respect to every input, so the same model serves simulation, sensitivity, optimization and technoeconomics.',
        links: [['repo', GH('jkitchin/differentiable-flowsheets')], ['docs', `${SITE}/differentiable-flowsheets/`]] });

  const PLUGINS = [
    ['bio', 'Bio', 'Biomanufacturing', 'Bioreactors, chromatography and filtration for biopharmaceutical processes.', 'unit-operations-bio'],
    ['cc', 'CC', 'Carbon capture', 'Absorber, stripper and solvent models for post-combustion carbon capture.', 'unit-operations-carbon-capture'],
    ['gas', 'Gas', 'Gas transmission networks', 'Steady-state gas networks with a topology-computed sequential decomposition, differentiable tear solving, and equation-oriented residuals for simultaneous solves.', 'unit-operations-gas'],
    ['ree', 'REE', 'Rare earth separations', 'Solvent extraction cascades for separating rare earth elements.', 'unit-operations-ree'],
    ['power', 'Power', 'Electrical grids', 'Electrical grid components that couple process models to power systems.', 'unit-operations-power'],
    ['refinery', 'Refinery', 'Petroleum refining', 'Refinery unit operations for petroleum processing.', 'unit-operations-refinery'],
  ];
  PLUGINS.forEach(([k, short, type, blurb, page], i) => {
    const ang = 172 - i * 24, p = polar(HUB, 136, ang), lp = polar(HUB, 172, ang);
    add({ id: `df-${k}`, kind: 'tile', size: 44, ...p, icon: `icons/difflow-${k}-icon.svg`,
          name: `difflow_${k}`, label: short, group: 'prog', type: `difflow plugin · ${type}`, blurb,
          links: [['docs', `${DF_DOCS}/${page}.html`], ['repo', GH('jkitchin/differentiable-flowsheets')]],
          spoke: true, lp: { x: lp.x - p.x, y: lp.y - p.y + 4 } });
  });

  // JAX solvers box
  const JB = { x: 352, y: 300, w: 150, h: 196 };
  [['optimistix', 'Root finding, least squares and minimization in JAX. difflow converges tear streams and nonlinear units with its Newton solvers.', 'patrick-kidger/optimistix'],
   ['diffrax', 'Differentiable ODE and DAE integrators in JAX; difflow\'s backend for dynamic and stiff models.', 'patrick-kidger/diffrax'],
   ['lineax', 'Linear solves in JAX, used for the linear algebra inside the nonlinear solves.', 'patrick-kidger/lineax']]
    .forEach(([name, blurb, repo], i) => add({
      id: `jx-${name}`, kind: 'pill', x: JB.x + JB.w / 2, y: JB.y + 62 + i * 38, w: 118, h: 28,
      name, label: name, group: 'prog', type: 'JAX solver (by Patrick Kidger)', blurb,
      links: [['repo', GH(repo)]] }));

  // Solvers column
  const SOLVERS = [
    ['feral', 'icons/feral.png', 'sparse LDLᵀ · inertia', 170,
     'A pure-Rust sparse symmetric indefinite linear solver with certified inertia counts: the linear algebra under the interior point iterations. Its sparse LU also drives discopt\'s simplex for node LPs.',
     [['repo', GH('jkitchin/feral')], ['docs', `${SITE}/feral/`]]],
    ['pounce', 'icons/pounce.svg', 'NLP · QP · conic', 305,
     'A pure-Rust family of interior point solvers that began as a port of Ipopt, now covering nonlinear, conic and quadratic programs. Solutions come with sensitivities, so it can sit inside a differentiable pipeline.',
     [['repo', GH('jkitchin/pounce')], ['docs', `${SITE}/pounce/`]]],
    ['discopt', 'icons/discopt.png', 'LP → MINLP', 440,
     'Spatial branch and bound over convex relaxations with pounce at the nodes: LP, QP, MILP, MIQP, NLP and MINLP from one model, with certified global bounds.',
     [['repo', GH(DISCOPT)], ['docs', `${SITE}/discopt/`]]],
    ['jax-go', 'icons/jax-go.svg', 'global opt of JAX code', 575,
     'Deterministic global optimization of plain JAX functions. It traces the function to a jaxpr, reinterprets every primitive on McCormick relaxations, and runs branch and bound for a certified lower bound. No algebraic model required.',
     [['repo', GH('jkitchin/jax-go')], ['docs', `${SITE}/jax-go/`]]],
  ];
  SOLVERS.forEach(([name, icon, cls, y, blurb, links, note]) => add({
    id: `s-${name}`, kind: 'card', x: SOLV_X, y, w: 196, h: 76, icon, name, label: name, cls,
    group: 'solv', type: 'Differentiable solver', blurb, links, note }));

  // External solvers box (beside discopt)
  const XB = { x: 760, y: 368, w: 60, h: 102 };
  [['HiGHS', 'Open-source LP/MILP solver and a core dependency of discopt: it backs the pure LP/MILP route and the MILP masters in the OA and GDP paths.', [['site', 'https://highs.dev']]],
   ['Gurobi', 'Commercial MILP solver; an optional backend for the MILP master problems in discopt\'s AMP algorithm.', [['site', 'https://www.gurobi.com']]],
   ['GAMS', 'discopt reads and writes GAMS models, and can register itself as a GAMS solver through the GMO/GEV API.', [['site', 'https://www.gams.com'], ['docs', GH(`${DISCOPT}/blob/main/docs/gams_solver_link.md`)]]]]
    .forEach(([name, blurb, links], i) => add({
      id: `xs-${name}`, kind: 'pill', x: XB.x + XB.w / 2, y: XB.y + 36 + i * 26, w: 50, h: 20,
      name, label: name, group: 'solv', type: 'External solver used by discopt', blurb, links, small: true, faint: true }));

  // discopt arch
  add({ id: 'eq-core', kind: 'core', x: ARCH.x, y: ARCH.y, icon: 'icons/discopt.png', name: 'discopt',
        group: 'eq', type: 'Core algebraic modeling language',
        blurb: 'A small core for writing models as equations: variables, expressions, constraints and objectives, compiled to a Rust AD tape. Everything else is built on it.',
        links: [['repo', GH(DISCOPT)], ['docs', `${SITE}/discopt/`]] });

  const MODULES = [
    ['GDP', 'tutorial_gdp', 'Generalized disjunctive programming', 'Boolean variables, logic propositions and disjunctions, reformulated by big-M, hull or logic-based outer approximation.'],
    ['DAE', 'tutorial_dae', 'Dynamic optimization', 'Collocation, finite differences and method of lines for optimal control, dynamic parameter estimation and PDE-constrained problems.'],
    ['RO', 'tutorial_robust', 'Robust optimization', 'Uncertainty sets with affine decision rules.'],
    ['SP', 'stochastic_programming', 'Stochastic programming', 'Extensive form, L-shaped, progressive hedging, multistage and risk-averse formulations.'],
    ['MPEC', 'complementarity_mpec', 'Complementarity', 'Complementarity constraints reformulated by disjunction, Scholtes regularization or SOS1.'],
    ['ML', 'nn_embedding', 'Machine learning embedding', 'Trained neural networks, decision trees and boosted ensembles embedded as constraints (ONNX, scikit-learn, PyTorch readers), plus trainable surrogates fit simultaneously with the physics.'],
  ];
  MODULES.forEach(([k, nb, type, blurb], i) => {
    const p = polar(ARCH, (ARCH.r0 + ARCH.r1) / 2, 160 - i * 28);
    add({ id: `m-${k}`, kind: 'pill', ...p, w: k.length > 3 ? 54 : 44, h: 26, name: k, label: k,
          group: 'eq', type: `discopt module · ${type}`, blurb,
          links: [['notebook', GH(`${DISCOPT}/blob/main/docs/notebooks/${nb}.ipynb`)], ['repo', GH(DISCOPT)], ['docs', `${SITE}/discopt/`]] });
  });

  const EQPLUG = [
    ['doe', 'DOE', 'icons/discopt-doe.svg', 'Design of experiments', 'From active-learning optimization and classical factorial designs to model-based D-, A- and E-optimal design, identifiability and model discrimination.', [['repo', GH('jkitchin/discopt-doe')], ['docs', `${SITE}/discopt-doe/`]]],
    ['calphad', 'Calphad', 'icons/discopt-calphad.png', 'Phase equilibrium', 'Certified CALPHAD phase equilibrium: a local Gibbs energy minimization checked by discopt\'s global solver.', [['repo', GH('jkitchin/discopt-calphad')], ['docs', `${SITE}/discopt-calphad/`]]],
    ['mkm', 'MKM', 'icons/discopt-mkm.png', 'Microkinetic modeling', 'Catalysis kinetics, degree of rate control, mechanism discovery and selection, and electrochemistry.', [['repo', GH('jkitchin/discopt-mkm')]]],
    ['fs', 'FS', null, 'Equation-oriented flowsheets', 'Streams, unit internals and specs stated as one algebraic system and solved simultaneously with pounce: recycles are ordinary equations, no tear streams. The equation-oriented counterpart to difflow, which serves as its test oracle.', [], 'Not public yet.'],
    ['spec', 'Speciation', null, 'Aqueous chemical equilibrium', 'Equilibrium with solids, gases, solid solutions, ion exchangers and sorbing surfaces, with PHREEQC databases and activity models.', [['repo', GH('jkitchin/discopt-speciation')], ['docs', `${SITE}/discopt-speciation/`]]],
    ['grid', 'Grid', null, 'Power systems', 'AC optimal power flow, locational marginal prices and a differentiable digital twin of the grid.', [], 'The repository is private for now.'],
    ['agg', 'Aggregation', 'icons/discopt-aggregation.png', 'Reduced-space presolve', 'Variable aggregation: substitutes variables defined by equalities into a smaller reduced-space model, then recovers them (Naik et al., arXiv:2502.13869).', [['repo', GH('jkitchin/discopt-aggregation')], ['docs', `${SITE}/discopt-aggregation/`]]],
    ['apps', 'Apps', 'icons/discopt-apps.svg', 'Application builders', 'AC optimal power flow and pooling problems in the pq-formulation.', [['repo', GH('jkitchin/discopt-apps')]]],
  ];
  EQPLUG.forEach(([k, label, icon, type, blurb, links, note], i) => {
    const p = polar(ARCH, (ARCH.r1 + ARCH.r2) / 2 - 4, 168 - i * (156 / (EQPLUG.length - 1)));
    add({ id: `p-${k}`, kind: 'tile', size: 38, ...p, icon, glyph: label.slice(0, 2), label,
          name: `discopt-${k === 'spec' ? 'speciation' : k === 'agg' ? 'aggregation' : k}`,
          group: 'eq', type: `discopt plugin · ${type}`, blurb, links, note });
  });

  // Surrogates
  const SY = 760;
  const SURR = [
    ['jaxsr', 'icons/jaxsr.png', 290, 'Symbolic regression in JAX. Its models are closed-form expressions, so they drop into difflow as functions and into discopt as algebra.', [['repo', GH('jkitchin/jaxsr')], ['docs', `${SITE}/jaxsr/`]]],
    ['jax-ldt', 'icons/jax-ldt.png', 400, 'Linear and hyperplane decision trees in pure JAX: piecewise-linear surrogates that map naturally onto mixed-integer constraints.', [['repo', GH('jkitchin/jax-ldt')]]],
    ['jax-difftree', 'icons/difftree.svg', 510, 'Differentiable soft decision trees with built-in uncertainty quantification, scikit-learn estimators, affine leaves and MILP export.', [['repo', GH('jkitchin/jax-difftree')], ['docs', `${SITE}/jax-difftree/`]]],
    ['jax-ibart', 'icons/jax-ibart.svg', 620, 'Iterative Bayesian additive regression trees in JAX: interleaves operator-based feature engineering with BART screening to find compact symbolic descriptors, with conformal intervals and the BART posterior for uncertainty.', [['repo', GH('jkitchin/jax-ibart')], ['docs', `${SITE}/jax-ibart/`]]],
    ['pycse.sklearn', 'icons/pycse.svg', 735, 'A family of scikit-learn compatible regressors in pycse, many written in JAX, with prediction intervals and uncertainty estimates built in.', [['repo', GH('jkitchin/pycse')], ['docs', `${SITE}/pycse/`]]],
  ];
  SURR.forEach(([name, icon, x, blurb, links]) => add({
    id: `u-${name}`, kind: 'tile', size: 56, x, y: SY, icon, name, label: name, group: 'surr',
    type: 'Differentiable surrogate with UQ', blurb, links }));

  const FAN = [
    ['KAN', 'Kolmogorov-Arnold networks, with an LLPR uncertainty variant.', 'kan'],
    ['ICNN', 'Input-convex neural networks, convex by construction.', 'jax_icnn'],
    ['Monotonic', 'Neural networks constrained to be monotonic in chosen inputs.', 'jax_monotonic'],
    ['LLPR', 'Last-layer prediction rigidity: uncertainty for a trained network.', 'llpr_regressor'],
    ['DPOSE', 'Direct propagation of shallow ensembles for calibrated uncertainty.', 'dpose'],
    ['NNGMM', 'Neural network with a Gaussian mixture output for uncertainty.', 'nngmm'],
    ['ZENN', 'Zentropy-enhanced neural networks.', 'zenn'],
    ['SISSO', 'Sure independence screening and sparsifying operator for compact descriptors.', 'sisso'],
  ];
  FAN.forEach(([k, blurb, mod], i) => add({
    id: `f-${k}`, kind: 'pill', x: 868 + (i % 2) * 92, y: SY - 54 + Math.floor(i / 2) * 36, w: 86, h: 26,
    name: `pycse.sklearn.${mod}`, label: k, group: 'surr', type: 'pycse.sklearn model', blurb,
    links: [['source', GH(`jkitchin/pycse/${mod === 'zenn' ? 'tree' : 'blob'}/master/src/pycse/sklearn/${mod}${mod === 'zenn' ? '' : '.py'}`)]], small: true }));

  const byId = Object.fromEntries(N.map(n => [n.id, n]));

  // ---------- edges ----------
  // [from, to, group, style, label, labelPos{x,y}, path override]
  const H = HUB, C = SOLV_X - 102;   // C: left edge of the solver cards
  const ML = byId['m-ML'];
  const E = [
    ['difflow', 'jx-box', 'prog', 'solid', null, null,
      `M ${H.x + 44} ${H.y} C ${H.x + 90} ${H.y}, ${JB.x - 50} ${JB.y + 100}, ${JB.x - 2} ${JB.y + 100}`],
    ['difflow', 's-pounce', 'prog', 'dash', 'residual form → simultaneous', { x: 420, y: 268 },
      `M ${H.x + 44} ${H.y - 24} C 300 300, 420 285, ${C} 300`],
    ['difflow', 's-discopt', 'prog', 'dash', 'implicit block in an EO model', { x: 430, y: 548 },
      `M ${H.x + 40} ${H.y + 30} C 290 540, 450 530, ${C} 470`],
    ['difflow', 's-jax-go', 'prog', 'dot', 'global bounds on JAX programs', { x: 400, y: 612 },
      `M ${H.x} ${H.y + 72} C ${H.x} 560, 380 580, ${C} 580`],
    ['s-feral', 's-pounce', 'solv', 'solid', 'KKT solves', { x: SOLV_X + 10, y: 242, anchor: 'start' }, null],
    ['s-pounce', 's-discopt', 'solv', 'solid', 'node NLPs', { x: SOLV_X + 10, y: 377, anchor: 'start' }, null],
    ['eq-core', 's-discopt', 'eq', 'solid', ['compiled', '& solved'], { x: 778, y: 534 },
      `M ${ARCH.x - ARCH.r2 + 2} ${ARCH.y - 2} C 800 510, 760 500, ${SOLV_X + 60} ${440 + 42}`],
    ['s-discopt', 'xs-box', 'solv', 'tie', null, null,
      `M ${SOLV_X + 100} 430 L ${XB.x} 430`],
    ['surr', 'difflow', 'surr', 'dash', ['JAX callables', 'as unit models'], { x: 116, y: 640, anchor: 'end' },
      `M 262 ${SY - 30} C 80 720, 90 470, ${H.x - 40} ${H.y + 22}`],
    ['surr', 'm-ML', 'surr', 'dash', ['embedded as', 'constraints'], { x: 1196, y: 630, anchor: 'start' },
      `M 1062 ${SY} C 1180 ${SY}, 1180 620, ${ML.x + 2} ${ML.y + 18}`],
    ['surr', 's-jax-go', 'surr', 'dot', 'certify over a surrogate', { x: SOLV_X + 10, y: 652, anchor: 'start' },
      `M ${SOLV_X} 674 L ${SOLV_X} 619`],
  ];

  // ---------- drawing helpers ----------
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  const txt = (s, attrs, parent) => { const t = el('text', attrs, parent); t.textContent = s; return t; };
  const color = g => `var(--${g})`;

  const bg = document.getElementById('bg');
  const edgeG = document.getElementById('edges');
  const nodeG = document.getElementById('nodes');

  // column headers
  [['Programs', 235, 'Python + JAX · sequential modular'],
   ['Solvers', SOLV_X, 'differentiable · NLP → MI(LQN)P'],
   ['Equations', ARCH.x, 'algebraic modeling · simultaneous']].forEach(([h, x, s], i) => {
    txt(h, { x, y: 56, class: 'h', 'text-anchor': 'middle' }, bg);
    el('line', { x1: x - 70, x2: x + 70, y1: 68, y2: 68, stroke: color(['prog', 'solv', 'eq'][i]), 'stroke-width': 3, 'stroke-linecap': 'round' }, bg);
    txt(s, { x, y: 92, class: 'sub', 'text-anchor': 'middle' }, bg);
  });

  // solver column backdrop
  el('rect', { x: SOLV_X - 116, y: 118, width: 232, height: 510, rx: 18, fill: color('solv-soft') }, bg);

  // JAX solver box
  el('rect', { x: JB.x, y: JB.y, width: JB.w, height: JB.h, rx: 16, fill: color('prog-soft'), stroke: color('prog'), 'stroke-opacity': .35 }, bg);
  txt('JAX solvers', { x: JB.x + JB.w / 2, y: JB.y + 28, 'text-anchor': 'middle', class: 'name', style: `fill:${color('prog')}` }, bg);
  txt('sequential modular solve', { x: JB.x + JB.w / 2, y: JB.y + JB.h - 14, 'text-anchor': 'middle', class: 'lbl-sm' }, bg);

  // external solver box: subtle, like the JAX box
  el('rect', { x: XB.x, y: XB.y, width: XB.w, height: XB.h, rx: 12, fill: color('solv-soft'), stroke: color('solv'), 'stroke-opacity': .3 }, bg);
  txt('external', { x: XB.x + XB.w / 2, y: XB.y + 17, 'text-anchor': 'middle', class: 'lbl-sm', style: `fill:${color('solv')}` }, bg);

  // arch rings (outer to inner)
  const ring = (r, fill) => el('path', {
    d: `M ${ARCH.x - r} ${ARCH.y} A ${r} ${r} 0 0 1 ${ARCH.x + r} ${ARCH.y} Z`,
    fill, stroke: color('eq'), 'stroke-opacity': .45, 'stroke-width': 1.5 }, bg);
  ring(ARCH.r2, color('eq-3')); ring(ARCH.r1, color('eq-2')); ring(ARCH.r0, color('eq-1'));
  el('line', { x1: ARCH.x - ARCH.r2 - 6, x2: ARCH.x + ARCH.r2 + 6, y1: ARCH.y, y2: ARCH.y, stroke: color('eq'), 'stroke-width': 2.5, 'stroke-linecap': 'round' }, bg);
  txt('core', { x: ARCH.x, y: ARCH.y + 22, 'text-anchor': 'middle', class: 'lbl' }, bg);
  txt('modules', { x: ARCH.x - (ARCH.r0 + ARCH.r1) / 2, y: ARCH.y + 22, 'text-anchor': 'middle', class: 'lbl' }, bg);
  txt('plugins', { x: ARCH.x - (ARCH.r1 + ARCH.r2) / 2, y: ARCH.y + 22, 'text-anchor': 'middle', class: 'lbl' }, bg);

  // surrogate band
  el('rect', { x: 200, y: 676, width: 860, height: 180, rx: 18, fill: color('surr-soft') }, bg);
  txt('Differentiable surrogates with UQ', { x: 232, y: 710, 'text-anchor': 'start', class: 'name', style: `fill:${color('surr')};font-size:19px` }, bg);
  // fan rays from pycse.sklearn to its models
  const pyc = byId['u-pycse.sklearn'];
  FAN.forEach(([k]) => {
    const f = byId[`f-${k}`];
    el('line', { x1: pyc.x + 32, y1: pyc.y, x2: f.x - f.w / 2 - 2, y2: f.y, stroke: color('surr'), 'stroke-opacity': .35, 'stroke-width': 1.3, class: 'spoke', 'data-a': pyc.id, 'data-b': f.id }, bg)
      .setAttribute('style', `stroke:${color('surr')}`);
  });

  // spokes from difflow to plugins
  N.filter(n => n.spoke).forEach(n => {
    const a = Math.atan2(n.y - HUB.y, n.x - HUB.x);
    el('line', { x1: HUB.x + Math.cos(a) * 46, y1: HUB.y + Math.sin(a) * 46,
                 x2: n.x - Math.cos(a) * 26, y2: n.y - Math.sin(a) * 26,
                 class: 'spoke', 'data-a': 'difflow', 'data-b': n.id }, bg);
  });

  // edges
  E.forEach(([a, b, g, style, label, lp, d]) => {
    if (!d) {
      const A = byId[a], B = byId[b];
      d = `M ${A.x} ${A.y + A.h / 2 + 2} L ${B.x} ${B.y - B.h / 2 - 4}`;
    }
    // 'tie': a short unmarked dotted link to a side box
    const tie = style === 'tie';
    el('path', { d, class: `edge ${tie ? 'dot' : style === 'solid' ? '' : style}`, stroke: color(g),
                 ...(tie ? { 'stroke-opacity': .6 } : { 'marker-end': `url(#arr-${g})` }), 'data-a': a, 'data-b': b }, edgeG);
    if (label) [].concat(label).forEach((line, i) => txt(line, { x: lp.x, y: lp.y + i * 15, 'text-anchor': lp.anchor || 'middle', class: 'elbl', style: `fill:${color(g)}`, 'data-a': a, 'data-b': b }, edgeG));
  });

  // nodes
  const glyphTile = (g, n, s) => {
    el('rect', { x: -s / 2, y: -s / 2, width: s, height: s, rx: s * .22, class: 'tile' }, g);
    el('rect', { x: -s / 2 + 3, y: -s / 2 + 3, width: s - 6, height: s - 6, rx: s * .2, fill: color(n.group), opacity: .9 }, g);
    txt(n.glyph, { x: 0, y: s * .13, 'text-anchor': 'middle', style: `fill:#fff;font-weight:700;font-size:${s * .36}px` }, g);
  };

  N.forEach(n => {
    const g = el('g', { class: 'node', id: `n-${n.id}`, transform: `translate(${n.x} ${n.y})`, tabindex: 0, role: 'button', 'aria-label': `${n.name}: ${n.type}` }, nodeG);
    n.g = g;
    if (n.kind === 'tile') {
      const s = n.size;
      if (n.icon) {
        el('rect', { x: -s / 2, y: -s / 2, width: s, height: s, rx: s * .22, class: 'tile' }, g);
        el('image', { href: n.icon, x: -s / 2 + 3, y: -s / 2 + 3, width: s - 6, height: s - 6, preserveAspectRatio: 'xMidYMid meet' }, g);
      } else glyphTile(g, n, s);
      const big = s >= 56;
      const at = n.lp || { x: 0, y: s / 2 + (big ? 20 : 15) };
      txt(n.label, { ...at, 'text-anchor': 'middle', class: big ? 'name' : 'lbl-sm', style: big ? 'font-size:14px' : '' }, g);
    } else if (n.kind === 'card') {
      el('rect', { x: -n.w / 2, y: -n.h / 2, width: n.w, height: n.h, rx: 14, class: 'card' }, g);
      if (n.icon) {
        el('rect', { x: -n.w / 2 + 8, y: -26, width: 52, height: 52, rx: 10, fill: 'var(--plate)' }, g);
        el('image', { href: n.icon, x: -n.w / 2 + 10, y: -24, width: 48, height: 48, preserveAspectRatio: 'xMidYMid meet' }, g);
      } else {
        el('rect', { x: -n.w / 2 + 8, y: -26, width: 52, height: 52, rx: 10, fill: color('solv') }, g);
        txt('go', { x: -n.w / 2 + 34, y: 7, 'text-anchor': 'middle', style: 'fill:#fff;font-weight:800;font-size:20px' }, g);
      }
      txt(n.name, { x: -n.w / 2 + 72, y: -3, class: 'name', style: 'font-size:19px' }, g);
      txt(n.cls, { x: -n.w / 2 + 72, y: 17, class: 'cls' }, g);
    } else if (n.kind === 'pill') {
      el('rect', { x: -n.w / 2, y: -n.h / 2, width: n.w, height: n.h, rx: n.h / 2, class: 'pill card', style: `stroke:${color(n.group)}${n.faint ? ';stroke-opacity:.5' : ''}` }, g);
      txt(n.label, { x: 0, y: n.faint ? 4 : 4.5, class: 'pill-txt', style: `fill:${color(n.group)};font-size:${n.faint ? 11 : n.small ? 12 : 13}px;font-weight:${n.faint ? 600 : 650}` }, g);
    } else if (n.kind === 'core') {
      el('path', { d: `M ${-ARCH.r0} 0 A ${ARCH.r0} ${ARCH.r0} 0 0 1 ${ARCH.r0} 0 Z`, fill: 'transparent' }, g);
      el('rect', { x: -26, y: -66, width: 52, height: 52, rx: 10, class: 'tile' }, g);
      el('image', { href: n.icon, x: -24, y: -64, width: 48, height: 48 }, g);
      txt('discopt', { x: 0, y: -2, 'text-anchor': 'middle', class: 'name', style: 'font-size:15px' }, g);
    }
  });

  // ---------- interaction ----------
  const svg = document.getElementById('map');
  const tip = document.getElementById('tip');
  const wrap = document.getElementById('wrap');
  let pinned = null, hideTimer = null;

  // the JAX solver box and the surrogate band act as group endpoints for edges
  const members = { 'jx-box': N.filter(n => n.id.startsWith('jx-')).map(n => n.id),
                    'xs-box': N.filter(n => n.id.startsWith('xs-')).map(n => n.id),
                    'surr': N.filter(n => n.group === 'surr').map(n => n.id) };
  const expand = id => members[id] || [id];

  const highlight = id => {
    svg.classList.add('focus');
    const lit = new Set([id]);
    svg.querySelectorAll('[data-a]').forEach(e => {
      const as = expand(e.dataset.a), bs = expand(e.dataset.b);
      if (as.includes(id) || bs.includes(id)) {
        e.classList.add('lit');
        [...as, ...bs].forEach(x => lit.add(x));
      }
    });
    N.forEach(n => n.g.classList.toggle('lit', lit.has(n.id)));
  };
  const unhighlight = () => {
    svg.classList.remove('focus');
    svg.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
  };

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = n => {
    clearTimeout(hideTimer);
    const links = n.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('');
    tip.innerHTML = `<div class="t-head">${n.icon ? `<img src="${n.icon}" alt="">` : ''}
        <div><div class="t-name">${esc(n.name)}</div><div class="t-kind">${esc(n.type)}</div></div></div>
      <p>${esc(n.blurb)}</p>
      ${links ? `<div class="t-links">${links}</div>` : ''}
      ${n.note ? `<div class="t-note">${esc(n.note)}</div>` : ''}`;
    tip.classList.add('show');
    const r = n.g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left - w.left + r.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, w.width - tw - 8));
    let top = r.bottom - w.top + 8;
    if (top + th > w.height && r.top - w.top - th - 8 > 0) top = r.top - w.top - th - 8;
    tip.style.left = `${left}px`; tip.style.top = `${top}px`;
    N.forEach(m => m.g.classList.toggle('active', m === n));
    highlight(n.id);
  };
  const hide = () => {
    if (pinned) return;
    hideTimer = setTimeout(() => {
      tip.classList.remove('show');
      N.forEach(m => m.g.classList.remove('active'));
      unhighlight();
    }, 180);
  };

  N.forEach(n => {
    n.g.addEventListener('mouseenter', () => { if (!pinned) show(n); });
    n.g.addEventListener('mouseleave', hide);
    n.g.addEventListener('focus', () => { if (!pinned) show(n); });
    n.g.addEventListener('blur', hide);
    n.g.addEventListener('click', e => {
      e.stopPropagation();
      pinned = pinned === n ? null : n;
      show(n);
    });
    n.g.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinned = n; show(n); }
    });
  });
  tip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  tip.addEventListener('mouseleave', hide);
  const unpin = () => { pinned = null; hideTimer = setTimeout(() => {}, 0); tip.classList.remove('show'); N.forEach(m => m.g.classList.remove('active')); unhighlight(); };
  document.addEventListener('click', e => { if (!tip.contains(e.target)) unpin(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });
})();
</script>
</body>
</html>
