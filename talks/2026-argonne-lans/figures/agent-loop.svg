    <rect x="10" y="215" width="150" height="56" rx="10" fill="#fdebd3" stroke="#b36b00" stroke-width="2"/>
    <text x="85" y="240">Reflect</text>
    <text x="85" y="262" font-size="14" fill="#555">done? try again?</text>
  </g>
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M260,66 L260,106"/>
    <path d="M335,150 Q430,160 435,211"/>
