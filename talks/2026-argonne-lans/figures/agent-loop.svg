<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g font-size="20" text-anchor="middle">
    <rect x="185" y="10" width="150" height="56" rx="10" fill="#dbe8f6" stroke="#2c5d8f" stroke-width="2"/>
    <text x="260" y="45">You: a goal</text>

    <rect x="185" y="110" width="150" height="56" rx="10" fill="#fdebd3" stroke="#b36b00" stroke-width="2"/>
