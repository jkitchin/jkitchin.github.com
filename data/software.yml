# Software page data. Each group renders as a heading with a grid of cards.
#
# Fields:
#   name         display name
#   repo         GitHub owner/name (stars, forks, release, last push come from here)
#   description  one or two sentences
#   icon         optional path under assets/software/; cards without one get a lettered tile
#   pypi         optional PyPI project name (shows the current version)
#   crate        optional crates.io crate name (shows the current version)
#   docs         optional documentation URL
#   status       optional: deprecated, or any short note shown next to the name.
#                Deprecated packages are moved to a Deprecated section at the end.
#   featured     optional: true shows the package in a large card above the groups
#
# Live numbers: scripts/update_software_stats.py writes data/software-stats.json,
# which is baked into the page; assets/software.js refreshes it in the browser.

- group: Featured
  packages:
    - name: scimax for VS Code
      repo: jkitchin/scimax_vscode
      description: The scimax scientific computing environment for VS Code. Org-mode and Markdown editing, runnable source blocks with Jupyter kernels, org-ref citations, a research journal and capture templates, Marp slide decks, and export to PDF, Word and Jupyter notebooks.
      icon: assets/software/scimax-vscode.png
      docs: /scimax_vscode/
      featured: true

- group: Optimization
  packages:
    - name: discopt
      repo: jkitchin/discopt
      description: A mixed-integer nonlinear programming modeling language and solver, using spatial branch and bound over convex relaxations with interior point subsolvers.
      icon: assets/software/discopt.png
      pypi: discopt
      docs: /discopt/
    - name: pounce
      repo: jkitchin/pounce
      description: A pure-Rust family of interior point solvers that began as a port of Ipopt, now covering nonlinear, conic and quadratic programs.
      icon: assets/software/pounce.svg
      pypi: pounce-solver
      docs: /pounce/
    - name: feral
      repo: jkitchin/feral
      description: A pure-Rust sparse symmetric indefinite linear solver with certified inertia counts, built for interior point optimization.
      icon: assets/software/feral.png
      crate: feral
      docs: /feral/
    - name: ripopt
      repo: jkitchin/ripopt
      description: A memory-safe interior point optimizer for nonlinear programming, written in Rust. Superseded by pounce.
      icon: assets/software/ripopt.png
      pypi: ripopt
      crate: ripopt
      docs: /ripopt/
      status: deprecated

- group: discopt plugins
  intro: Extensions that add domain models and methods to the discopt modeling language.
  packages:
    - name: discopt-doe
      repo: jkitchin/discopt-doe
      icon: assets/software/discopt-doe.svg
      description: Design of experiments for discopt, from active-learning optimization and classical factorial and mixture designs to model-based D-, A- and E-optimal design.
      pypi: discopt-doe
      docs: /discopt-doe/
    - name: discopt-mkm
      repo: jkitchin/discopt-mkm
      description: Microkinetic modeling for discopt, with catalysis kinetics, degree of rate control, mechanism discovery and selection, and electrochemistry.
      icon: assets/software/discopt-mkm.png
    - name: discopt-aggregation
      repo: jkitchin/discopt-aggregation
      description: Variable aggregation, a reduced-space presolve for nonlinear optimization, following Naik et al. (arXiv:2502.13869).
      icon: assets/software/discopt-aggregation.png
      pypi: discopt-aggregation
      docs: /discopt-aggregation/
    - name: discopt-apps
      repo: jkitchin/discopt-apps
      icon: assets/software/discopt-apps.svg
      description: Application builders for AC optimal power flow and pooling problems in discopt.
    - name: discopt-course
      repo: jkitchin/discopt-course
      icon: assets/software/discopt-course.svg
      description: An optimization course and a tutor command-line tool built on discopt.

- group: Process modeling and surrogates
  packages:
    - name: difflow
      repo: jkitchin/differentiable-flowsheets
      description: A JAX framework for differentiable chemical process flowsheets, for simulation, optimization and technoeconomic analysis.
      icon: assets/software/difflow.svg
      pypi: difflow
      docs: /differentiable-flowsheets/
    - name: jax-difftree
      repo: jkitchin/jax-difftree
      description: Differentiable soft decision trees in JAX with built-in uncertainty quantification, scikit-learn estimators and MILP export.
      icon: assets/software/difftree.svg
      docs: /jax-difftree/
    - name: jax-ldt
      repo: jkitchin/jax-ldt
      description: Linear and hyperplane decision trees in pure JAX for piecewise-linear surrogate models.
      icon: assets/software/jax-ldt.png
    - name: tep-rust
      repo: jkitchin/tep-rust
      icon: assets/software/tep-rust.svg
      description: A Tennessee Eastman Process simulator in Rust, with Python wheels and a browser app.
      docs: /tep-rust/

- group: Machine learning and scientific computing
  packages:
    - name: jaxsr
      repo: jkitchin/jaxsr
      description: A symbolic regression engine built on JAX.
      icon: assets/software/jaxsr.png
      pypi: jaxsr
      docs: /jaxsr/
    - name: pycse
      repo: jkitchin/pycse
      description: Python computations in science and engineering. A book and a library of helpers for numerical methods, regression and more.
      icon: assets/software/pycse.svg
      pypi: pycse
      docs: /pycse/
    - name: vasp
      repo: jkitchin/vasp
      description: An ASE-compliant Python interface to VASP.
      pypi: vasp-ase
    - name: dft-book
      repo: jkitchin/dft-book
      description: Modeling materials using density functional theory with VASP and the Atomic Simulation Environment.
      docs: /dft-book/

- group: AI tools for research
  packages:
    - name: litdb
      repo: jkitchin/litdb
      description: Curate and search your scientific literature with natural-language queries over a local database of papers.
      icon: assets/software/litdb.png
      pypi: litdb
    - name: crucible
      repo: jkitchin/crucible
      description: A personal knowledge base where an LLM distills papers, notebooks and data into an interlinked org-mode wiki.
      icon: assets/software/crucible.png
    - name: skillz
      repo: jkitchin/skillz
      description: A command-line tool for managing AI assistant skills and slash commands across LLM platforms.
      icon: assets/software/skillz.png
