<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Kitchin Research Group</title>
  <!-- K as a graph (systems), lower arm a descent curve to a minimum (optimization), atomic lattice (materials) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2547"/><stop offset="1" stop-color="#0a1b33"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- lattice on the same 12-unit grid as the letter -->
  <g fill="#6f9fd8" opacity=".35">
    <circle cx="70" cy="46" r="1.4"/><circle cx="82" cy="46" r="1.4"/><circle cx="94" cy="46" r="1.4"/><circle cx="106" cy="46" r="1.4"/>
    <circle cx="76" cy="56" r="1.4"/><circle cx="88" cy="56" r="1.4"/><circle cx="100" cy="56" r="1.4"/>
    <circle cx="82" cy="66" r="1.4"/><circle cx="94" cy="66" r="1.4"/><circle cx="106" cy="66" r="1.4"/>
    <circle cx="100" cy="76" r="1.4"/>
  </g>
  <!-- K: stem and upper arm (graph edges) -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
    <path d="M38 24 V104"/>
    <path d="M38 68 L84 26"/>
  </g>
  <!-- lower arm: a descent curve into a minimum -->
  <path d="M38 68 C54 68 60 98 76 98 C86 98 92 90 98 80" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- nodes -->
  <g fill="#0b1f3a" stroke="#ffffff" stroke-width="4">
    <circle cx="38" cy="68" r="6.5"/><circle cx="84" cy="26" r="6.5"/>
  </g>
  <circle cx="76" cy="98" r="6" fill="#4cc9f0"/>
</svg>
