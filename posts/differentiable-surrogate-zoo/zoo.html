<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surrogate Zoo</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1b1f3b;
    --muted: #5d6280;
    --rule: #d9dcea;
    --card: #ffffff;
    --card-edge: #c9cde0;
    --tip-bg: #ffffff;
    --tip-shadow: 0 6px 24px rgba(20, 24, 60, .18);
    /* model families: accent for ink, soft for the band */
    --sym: #2f63c4;   --sym-soft: #eaf0fa;
    --tree: #2f7d3a;  --tree-soft: #e8f4e4;
    --nn: #9b37a0;    --nn-soft: #f7eaf7;
    --dist: #c4501f;  --dist-soft: #fdeee6;
    /* packages */
    --jaxsr: #0f766e;
    --ldt: #a8690c;
    --difftree: #be3a63;
    --pycse: #23286b;
    --ibart: #6d28d9;
    --shared: #5d6280;
    --pill-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131c; --ink: #e8e9f3; --muted: #a2a6c2; --rule: #2e3146;
      --card: #1c1e2c; --card-edge: #393c56;
      --tip-bg: #1f2130; --tip-shadow: 0 6px 24px rgba(0, 0, 0, .5);
      --sym: #85aaf5;  --sym-soft: #161d2e;
      --tree: #7fd18a; --tree-soft: #142217;
      --nn: #e290e6;   --nn-soft: #261727;
      --dist: #f79a72; --dist-soft: #2a1912;
      --jaxsr: #4fd1c5; --ldt: #f2c062; --difftree: #f08aa9; --pycse: #aab3ff; --ibart: #c4b5fd; --shared: #a2a6c2;
      --pill-ink: #12131c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131c; --ink: #e8e9f3; --muted: #a2a6c2; --rule: #2e3146;
    --card: #1c1e2c; --card-edge: #393c56;
    --tip-bg: #1f2130; --tip-shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --sym: #85aaf5;  --sym-soft: #161d2e;
    --tree: #7fd18a; --tree-soft: #142217;
    --nn: #e290e6;   --nn-soft: #261727;
    --dist: #f79a72; --dist-soft: #2a1912;
    --jaxsr: #4fd1c5; --ldt: #f2c062; --difftree: #f08aa9; --pycse: #aab3ff; --ibart: #c4b5fd; --shared: #a2a6c2;
    --pill-ink: #12131c;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { position: relative; max-width: 1240px; margin: 0 auto; padding: 8px 16px 16px; }
  svg { display: block; width: 100%; height: auto; }

  svg text { fill: var(--ink); font-family: inherit; }
  .lbl { font-size: 12.5px; fill: var(--muted); }
  .fam { font-size: 18px; font-weight: 700; }
  .name { font-size: 12.5px; font-weight: 650; text-anchor: middle; }
  .pill-txt { font-size: 10.5px; font-weight: 650; text-anchor: middle; fill: var(--pill-ink); }

  .node, .pkg { cursor: pointer; outline: none; transition: opacity .15s; }
  .node .card { stroke-width: 1.3; }
  .node:hover .card, .node:focus-visible .card, .node.active .card { stroke-width: 2.6; }
  .node.todo .card { stroke-dasharray: 5 4; }
  .glyph * { vector-effect: non-scaling-stroke; }
  .pkg:hover .pkg-box, .pkg:focus-visible .pkg-box, .pkg.active .pkg-box { stroke-width: 2.4; }

  svg.focus .node:not(.lit), svg.focus .pkg:not(.lit) { opacity: .18; }

  .tip {
    position: absolute; z-index: 5; width: 340px; max-width: calc(100% - 32px);
    background: var(--tip-bg); color: var(--ink); border: 1px solid var(--card-edge);
    border-top: 4px solid var(--accent, var(--card-edge));
    border-radius: 10px; box-shadow: var(--tip-shadow); padding: 12px 14px;
    font-size: 14px; display: none;
  }
  .tip.show { display: block; }
  .tip .t-name { font-weight: 700; font-size: 16px; }
  .tip .t-kind { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .tip code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tip p { margin: 0 0 8px; }
  .tip dl { margin: 0 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  .tip dt { font-weight: 650; color: var(--muted); font-size: 12.5px; padding-top: 1px; }
  .tip dd { margin: 0; }
  .tip h4 { margin: 8px 0 3px; font-size: 12.5px; color: var(--muted); font-weight: 650; }
  .tip ul { margin: 0; padding-left: 16px; }
  .tip li { margin: 1px 0; }
  .tip a { color: var(--accent, var(--ink)); font-weight: 600; text-decoration: none; }
  .tip a:hover { text-decoration: underline; }
  .tip .gap { color: var(--muted); font-style: italic; }
  .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <svg id="map" viewBox="0 0 1240 932" role="img"
       aria-labelledby="map-title map-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="map-title">Our differentiable, uncertainty-aware surrogate zoo</title>
    <desc id="map-desc">Surrogate models from five packages, jaxsr, jax-ibart, jax-ldt,
      jax-difftree and pycse.sklearn, grouped by model family: symbolic and regression models, trees and piecewise
      models, neural networks, and distributions and flows. Each model has an icon, a tooltip about
      what it is and how it quantifies uncertainty, and links to example notebooks.</desc>
    <defs id="defs"></defs>
    <g id="pkgs"></g>
    <g id="bands"></g>
    <g id="nodes"></g>
    <g id="legend"></g>
  </svg>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="hint">Hover or tap a model for what it is, its uncertainty, and example notebooks. Hover a package to light its models.</div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const GH = 'https://github.com/jkitchin';
  const sr = (f, t) => [t, `${GH}/jaxsr/blob/main/docs/examples/${f}.ipynb`];
  const ldt = (f, t) => [t, `${GH}/jax-ldt/blob/main/examples/${f}.ipynb`];
  const dt = (f, t) => [t, `${GH}/jax-difftree/blob/main/docs/examples/${f}.ipynb`];
  const py = (f, t) => [t, `${GH}/pycse/blob/master/src/pycse/examples/${f}.ipynb`];
  const ib = (f, t) => [t, `${GH}/jax-ibart/blob/main/docs/examples/${f}.ipynb`];
  const pysrc = f => `${GH}/pycse/blob/master/src/pycse/sklearn/${f}.py`;

  // ---------- packages ----------
  const PKG = {
    jaxsr: { name: 'jaxsr', color: 'jaxsr', logo: 'icons/jaxsr.png',
      kind: 'Symbolic regression in JAX', short: 'symbolic regression',
      what: 'Finds readable equations by selecting a sparse set of terms from a library of basis functions, with uncertainty built in.',
      links: [['Repository', `${GH}/jaxsr`], ['Documentation', 'https://kitchingroup.cheme.cmu.edu/jaxsr/']] },
    ibart: { name: 'jax-ibart', color: 'ibart', logo: 'icons/jax-ibart.svg',
      kind: 'Iterative BART in JAX', short: 'descriptor discovery',
      what: 'Finds compact symbolic descriptors by alternating operator-based feature engineering with BART screening, so the candidate pool stays small at every step.',
      links: [['Repository', `${GH}/jax-ibart`], ['Documentation', 'https://kitchingroup.cheme.cmu.edu/jax-ibart/']] },
    ldt: { name: 'jax-ldt', color: 'ldt', logo: 'icons/jax-ldt.png',
      kind: 'Linear decision trees in JAX', short: 'linear model trees',
      what: 'Trees with a linear model in each leaf, with axis-aligned or oblique splits. Piecewise linear, so they embed exactly in a mixed-integer program.',
      links: [['Repository', `${GH}/jax-ldt`]] },
    difftree: { name: 'jax-difftree', color: 'difftree', logo: 'icons/difftree.svg',
      kind: 'Differentiable decision trees in JAX', short: 'soft trees',
      what: 'Soft, oblique trees trained end to end by gradient descent, with Gaussian leaves for a calibrated predictive variance.',
      links: [['Repository', `${GH}/jax-difftree`], ['Documentation', 'https://kitchingroup.cheme.cmu.edu/jax-difftree/']] },
    pycse: { name: 'pycse.sklearn', color: 'pycse', logo: 'icons/pycse.svg',
      kind: 'scikit-learn estimators with uncertainty', short: 'models with UQ',
      what: 'A collection of sklearn-compatible regressors, most in JAX/Flax, that return a standard deviation with every prediction.',
      links: [['Models (source)', `${GH}/pycse/tree/master/src/pycse/sklearn`],
              ['Example notebooks', `${GH}/pycse/tree/master/src/pycse/examples`]] },
    shared: { name: 'shared', color: 'shared' },
  };

  // ---------- families and their rows of models ----------
  const FAM = [
    { id: 'sym', name: 'Symbolic', lines: ['equations you can read,', 'differentiate and write', 'into an optimizer'],
      rows: [['sr', 'add', 'sup', 'rsm', 'bma', 'scls'], ['ibart', 'sisso', 'reg']] },
    { id: 'tree', name: 'Trees', lines: ['piecewise models: crisp', 'leaves for MILP, soft', 'leaves for gradients'],
      rows: [['ldt', 'hyp', 'dtr', 'dtc', 'leaf']] },
    { id: 'nn', name: 'Neural nets', lines: ['top: built-in structure', '(convex, monotonic,', 'periodic, learned basis)', '', 'bottom: uncertainty', 'heads and ensembles'],
      rows: [['icnn', 'mono', 'per', 'kan', 'kanl', 'zenn'], ['llpr', 'dpose', 'kfold', 'nnbr', 'nngmm']] },
    { id: 'dist', name: 'Distributions', lines: ['the whole p(y | x),', 'not just a mean and σ'],
      rows: [['flow', 'al', 'cmp']] },
  ];

  // ---------- models ----------
  // name: tile label (\n breaks), cls: classes, pkg, fw: framework, what, uq, opt: how it
  // goes into an optimizer (draws the ◆ badge), nbs: example notebooks, note
  const M = {
    sr: { name: 'Symbolic\nregression', cls: 'SymbolicRegressor, MultiOutputSymbolicRegressor', pkg: 'jaxsr', fw: 'JAX',
      what: 'Selects a sparse set of terms from a library of candidate basis functions, giving an equation y = Σ βᵢ φᵢ(x). Constraints such as bounds and monotonicity can be enforced; the multi-output version fits several targets at once.',
      uq: 'Prediction intervals from least squares, Pareto-front ensembles, conformal intervals and residual bootstrap.',
      opt: 'The result is an algebraic expression, so it can be written into an optimization model directly.',
      nbs: [sr('basic_usage', 'Basic usage'), sr('uncertainty_quantification', 'Uncertainty quantification'),
            sr('constraint_enforcement', 'Constraint enforcement'), sr('multi_output', 'Multi-output'),
            sr('comprehensive_tutorial', 'Comprehensive tutorial')] },
    add: { name: 'Additive\nsymbolic', cls: 'StagewiseSymbolicRegressor, BackfittingSymbolicRegressor, RecursiveSymbolicRegressor', pkg: 'jaxsr', fw: 'JAX',
      what: 'Builds the model as a sum of many small symbolic terms, fitted stagewise or by backfitting, instead of one large expression.',
      uq: 'Point predictions for now.',
      nbs: [sr('additive_symbolic_regression', 'Additive symbolic regression')] },
    sup: { name: 'Superposition', cls: 'SuperpositionRegressor', pkg: 'jaxsr', fw: 'JAX',
      what: 'Learns a symbolic shift law that collapses a family of curves onto one master curve, as in time-temperature superposition, Larson-Miller creep curves and isoconversional kinetics.',
      uq: 'Intervals on the learned shift-law parameters, such as an activation energy. Predictions are point values.',
      nbs: [sr('superposition_master_curves', 'Superposition master curves')] },
    rsm: { name: 'Response\nsurface', cls: 'ResponseSurface', pkg: 'jaxsr', fw: 'JAX',
      what: 'Classical response-surface methodology: design generators, coded variables, ANOVA and canonical analysis, on top of the symbolic regressor so it can leave the quadratic when the data support it.',
      uq: 'ANOVA and the regression intervals of the underlying fit.',
      opt: 'A quadratic, or an algebraic expression, with a stationary point you can analyze.',
      nbs: [sr('rsm_formulation', 'RSM formulation'), sr('doe_study_workflow', 'DOE study workflow')] },
    bma: { name: 'Model\naveraging', cls: 'BayesianModelAverage', pkg: 'jaxsr', fw: 'JAX',
      what: 'Weights many candidate equations by how well the data support them instead of picking a single winner.',
      uq: 'Model-form uncertainty: the spread between plausible equations shows up in the prediction.',
      nbs: [sr('uncertainty_quantification', 'Uncertainty quantification'),
            sr('model_comparison_isotherms', 'Model comparison: isotherms')] },
    scls: { name: 'Symbolic\nclassifier', cls: 'SymbolicClassifier', pkg: 'jaxsr', fw: 'JAX',
      what: 'A readable logistic model: sparse basis functions selected and fitted by iteratively reweighted least squares; one-vs-rest for several classes.',
      uq: 'Class probabilities from the logistic link.',
      nbs: [sr('symbolic_classification', 'Symbolic classification')] },
    ibart: { name: 'iBART', cls: 'IBart', pkg: 'ibart', fw: 'JAX (bartz BART, or a differentiable L0 screener)',
      what: 'Applies algebraic operators to the inputs a round at a time and keeps only the features BART screening selects, then fits a sparse linear model on the survivors. The descriptors carry their SymPy expressions, and a unit filter drops ones that are dimensionally meaningless.',
      uq: 'Split-conformal intervals over the whole fit, selection included; selection stability across bootstrap resamples; OLS intervals on the final model; and the BART posterior.',
      opt: 'The descriptors are algebra. to_discopt writes the fitted model into a discopt problem, with guards against poles and undefined logs, for a certified global optimum.',
      nbs: [ib('01_quickstart', '01 Quickstart'), ib('02_catalysis', '02 Single-atom catalysis'),
            ib('06_reaction_kinetics', '06 Reaction kinetics'), ib('08_uncertainty', '08 Uncertainty'),
            ib('09_optimization', '09 Optimizing over a model')] },
    sisso: { name: 'SISSO', cls: 'SISSO, SISSOEnsemble', pkg: 'pycse', fw: 'PyTorch (TorchSISSO)',
      what: 'Sure independence screening builds a very large space of composed features, then a sparsifying operator picks the few that explain the data.',
      uq: 'Hat-matrix intervals for a single equation. SISSOEnsemble trains a shallow ensemble of equations with NLL or CRPS.',
      opt: 'The selected descriptor is an algebraic expression.',
      nbs: [py('SISSO_Demo', 'SISSO demo'), py('SISSOEnsemble_Demo', 'SISSO ensemble demo')], code: pysrc('sisso') },
    reg: { name: 'regress /\nnlinfit', cls: 'pycse.regress, nlinfit, LinearRegressionUQ', pkg: 'pycse', fw: 'NumPy / SciPy',
      what: 'Linear and nonlinear least squares with parameter confidence intervals. predict and nlpredict carry them to prediction intervals. LinearRegressionUQ wraps the linear case as an sklearn estimator.',
      uq: 'Parameter covariance propagated to the prediction.',
      opt: 'Your own model equation, with fitted parameters.',
      nbs: [py('Regression_Functions_Demo', 'Regression functions demo')], code: pysrc('lr_uq'),
      note: 'No notebook for LinearRegressionUQ itself yet.' },

    ldt: { name: 'Linear\ntree', cls: 'LinearTreeRegressor', pkg: 'ldt', fw: 'JAX',
      what: 'An axis-aligned decision tree with a linear model in each leaf.',
      uq: 'Leaf-parameter covariance propagated linearly (or to second order), and Mondrian conformal intervals per leaf.',
      opt: 'Piecewise linear: embeds exactly in a MILP, for example in discopt. Also exports to ONNX.',
      nbs: [ldt('01_quickstart', '01 Quickstart'), ldt('02_uncertainty', '02 Uncertainty'),
            ldt('03_active_learning', '03 Active learning'), ldt('04_mip_optimization', '04 MIP optimization'),
            ldt('06_steam_tables', '06 Steam tables')] },
    hyp: { name: 'Hyperplane\ntree', cls: 'HyperplaneTreeRegressor', pkg: 'ldt', fw: 'JAX',
      what: 'Linear leaves with oblique splits w·x ≤ b, so boundaries that are not aligned with an axis need far fewer leaves.',
      uq: 'The same leaf-covariance and conformal intervals as the linear tree.',
      opt: 'Still piecewise linear, so it embeds exactly in a MILP.',
      nbs: [ldt('01_quickstart', '01 Quickstart'), ldt('04_mip_optimization', '04 MIP optimization'),
            ldt('05_onnx_export', '05 ONNX export'), ldt('06_steam_tables', '06 Steam tables')] },
    dtr: { name: 'Differentiable\ntree', cls: 'DifferentiableTreeRegressor', pkg: 'difftree', fw: 'JAX',
      what: 'A soft, oblique tree of fixed depth trained end to end by gradient descent. Each leaf is a Gaussian (multivariate for several outputs), so a prediction is a mixture weighted by soft path probabilities.',
      uq: 'Heteroscedastic variance split into within-leaf (aleatoric) and between-leaf (routing) parts. Closed-form conditionals p(y_unobs | x, y_obs) and gradient-based inverse design.',
      opt: 'Affine leaves can be hardened into a crisp piecewise-affine model and exported as leaf polytopes for a MILP.',
      nbs: [dt('heteroscedastic_demo', 'Heteroscedastic regression'), dt('multivariate_inverse_design', 'Multivariate inverse design'),
            dt('piecewise_linear_milp', 'Piecewise-linear MILP'), dt('failure_modes', 'Failure modes'), dt('scaling', 'Scaling')] },
    dtc: { name: 'Differentiable\nclassifier', cls: 'DifferentiableTreeClassifier', pkg: 'difftree', fw: 'JAX',
      what: 'The same soft oblique tree with class probabilities in the leaves.',
      uq: 'Predictive entropy split into aleatoric and epistemic parts.',
      nbs: [], note: 'No classification notebook yet.' },
    leaf: { name: 'Leaf-model\ntree', cls: 'LeafModelRegressor', pkg: 'pycse', fw: 'scikit-learn',
      what: 'A standard decision tree divides the data, then any sklearn model is fitted in each leaf. refine_splits re-chooses the thresholds for the leaf model, M5-style. A simple proof of concept next to jax-ldt.',
      uq: 'From the leaf model (return_std) or the leaf residuals, with post-hoc calibration.',
      nbs: [py('LeafModel_Demo', 'Leaf model demo')], code: pysrc('leaf_model') },

    icnn: { name: 'Convex NN\n(ICNN)', cls: 'JAXICNNRegressor', pkg: 'pycse', fw: 'JAX',
      what: 'An input-convex network: non-negative weights on the hidden path and convex, non-decreasing activations make f convex in x.',
      uq: 'Point predictions. Fit it as a convex lower bound, or pair it with a model that has intervals.',
      opt: 'Convex in x, so any local minimum of the surrogate is the global one.',
      nbs: [py('JAXICNNRegressor_Demo', 'ICNN demo')], code: pysrc('jax_icnn') },
    mono: { name: 'Monotonic\nNN', cls: 'JAXMonotonicRegressor', pkg: 'pycse', fw: 'JAX',
      what: 'Guaranteed increasing or decreasing in the inputs you choose, for physics where you know the sign of the effect.',
      uq: 'Last-layer prediction rigidity (LLPR).',
      nbs: [py('JAXMonotonicRegressor_Demo', 'Monotonic NN demo')], code: pysrc('jax_monotonic') },
    per: { name: 'Periodic\nNN', cls: 'JAXPeriodicRegressor', pkg: 'pycse', fw: 'JAX',
      what: 'Fourier features sin and cos(2πk x/T) on chosen inputs make the model exactly periodic in them: angles, time of day, seasons.',
      uq: 'Last-layer prediction rigidity (LLPR).',
      nbs: [py('JAXPeriodicRegressor_Demo', 'Periodic NN demo')], code: pysrc('jax_periodic') },
    kan: { name: 'KAN', cls: 'KAN', pkg: 'pycse', fw: 'JAX / Flax',
      what: 'A Kolmogorov-Arnold network: learnable B-spline functions on the edges instead of fixed activations on the nodes.',
      uq: 'An ensemble of output heads (n_ensemble), calibrated afterwards on a validation set.',
      nbs: [py('KAN_Demo', 'KAN demo')], code: pysrc('kan') },
    kanl: { name: 'KAN +\nLLPR', cls: 'KANLLPR', pkg: 'pycse', fw: 'JAX / Flax',
      what: 'A Kolmogorov-Arnold network with uncertainty from the prediction-rigidity formalism instead of an ensemble.',
      uq: 'Last-layer prediction rigidity (LLPR).',
      nbs: [py('KANLLPR_Demo', 'KAN + LLPR demo')], code: pysrc('kan_llpr') },
    zenn: { name: 'ZENN', cls: 'ZENNRegressor, ZENNRegressorNLL, ZENNClassifier', pkg: 'pycse', fw: 'JAX / Flax',
      what: 'Zentropy-enhanced neural network: a thermodynamics-inspired model for heterogeneous, multi-source data that predicts an energy at a temperature and can reconstruct the energy landscape.',
      uq: 'Epistemic and aleatoric parts. The NLL variant calibrates the aleatoric part to the noise.',
      nbs: [], code: `${GH}/pycse/tree/master/src/pycse/sklearn/zenn`,
      note: 'No example notebook yet. Reference: PNAS 123(1), e2511227122.' },

    llpr: { name: 'LLPR', cls: 'LLPRRegressor', pkg: 'pycse', fw: 'JAX / Flax',
      what: 'Last-layer prediction rigidity: an uncertainty computed from the last-layer features of a trained network, with no retraining and no ensemble.',
      uq: 'Prediction rigidity of the last layer, calibrated on held-out data.',
      nbs: [py('llpr_demo', 'LLPR demo'), py('llpr_study', 'LLPR study')], code: pysrc('llpr_regressor') },
    dpose: { name: 'DPOSE', cls: 'DPOSE', pkg: 'pycse', fw: 'JAX / Flax',
      what: 'Direct propagation of shallow ensembles: the members share the network and differ only in the last layer, trained with CRPS or NLL.',
      uq: 'Ensemble spread. Propagate it by applying any function to the members.',
      nbs: [py('DPOSE_Demo', 'DPOSE demo'), py('UQ_Comparison_Demo', 'UQ comparison')], code: pysrc('dpose') },
    kfold: { name: 'k-fold NN', cls: 'KfoldNN', pkg: 'pycse', fw: 'JAX / Flax',
      what: 'Each output neuron is trained on a different fold of the data, so one network carries a k-member ensemble.',
      uq: 'Spread across the output neurons.',
      nbs: [py('KfoldNN_Demo', 'k-fold NN demo')], code: pysrc('kfoldnn') },
    nnbr: { name: 'NN + Bayes\nlinear', cls: 'NeuralNetworkBLR', pkg: 'pycse', fw: 'scikit-learn',
      what: 'A neural network as a feature generator, with Bayesian linear regression as the last layer.',
      uq: 'The Bayesian last layer’s predictive variance.',
      nbs: [py('NNBR_Demo', 'NN + Bayesian linear demo'), py('UQ_Comparison_Demo', 'UQ comparison')], code: pysrc('nnbr') },
    nngmm: { name: 'NN + GMM', cls: 'NeuralNetworkGMM', pkg: 'pycse', fw: 'scikit-learn + gmr',
      what: 'Gaussian-mixture regression on network features.',
      uq: 'A mixture predictive distribution: handles multimodal and heteroscedastic noise.',
      nbs: [py('NNGMM_Demo', 'NN + GMM demo'), py('UQ_Comparison_Demo', 'UQ comparison')], code: pysrc('nngmm') },

    flow: { name: 'Normalizing\nflow', cls: 'NFlowsRegressor', pkg: 'pycse', fw: 'PyTorch (nflows)',
      what: 'Learns the whole conditional density p(y | x) as an invertible transform of a simple base distribution, so it also runs backwards: which x could give this y?',
      uq: 'Samples and quantiles of the full conditional distribution.',
      nbs: [py('nflows_regressor_examples', 'Normalizing flow regressor')], code: pysrc('nflows_regressor') },
    al: { name: 'Active\nlearning', cls: 'jaxsr acquisition, jax-ldt, pycse ActiveLearner', pkg: 'shared', fw: 'across packages', tool: true,
      what: 'Not a model: uses a model’s uncertainty to choose where to sample next, so the surrogate improves where it is least sure.',
      uq: 'Any model above that reports a standard deviation.',
      nbs: [sr('active_learning', 'jaxsr: active learning'), sr('langmuir_doe_active_learning', 'jaxsr: Langmuir DOE and active learning'),
            ldt('03_active_learning', 'jax-ldt: active learning'), py('ActiveLearning_pycse_Demo', 'pycse: active learning'),
            py('Active_Surrogate_Demo', 'pycse: active surrogate')] },
    cmp: { name: 'Compare\nUQ', cls: 'side-by-side studies', pkg: 'shared', fw: 'across packages', tool: true,
      what: 'Not a model: how the uncertainty methods compare on coverage, calibration and heteroscedastic noise.',
      uq: 'Conformal (MAPIE), Bayesian last layer, GMM last layer and shallow ensembles.',
      nbs: [py('UQ_Comparison_Demo', 'pycse: MAPIE vs NNBR vs NNGMM vs DPOSE'), dt('failure_modes', 'jax-difftree: failure modes')],
      note: 'No study yet across the trees, symbolic models and networks together.' },
  };
  Object.entries(M).forEach(([id, m]) => (m.id = id));

  // ---------- drawing helpers ----------
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  const v = name => `var(--${name})`;
  const defs = document.getElementById('defs');
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: 'context-stroke' },
    el('marker', { id: 'arr', viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto' }, defs));

  // ---------- icons: one glyph per model, drawn in a box about 64 × 40 around (0, 0) ----------
  const line = (g, d, c, w = 1.8, extra = {}) => el('path', { d, fill: 'none', stroke: c, 'stroke-width': w,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...extra }, g);
  const dot = (g, x, y, r, c, filled = true) => el('circle', { cx: x, cy: y, r, fill: filled ? c : v('card'), stroke: c, 'stroke-width': 1.5 }, g);
  const net = (g, layers, c, x0 = -26, x1 = 26, h = 30, hot = -1) => {
    // layers: node counts; edges of layer `hot` → next drawn heavier
    const xs = layers.map((_, i) => x0 + (x1 - x0) * i / (layers.length - 1));
    const ys = layers.map(n => Array.from({ length: n }, (_, k) => n === 1 ? 0 : -h / 2 + h * k / (n - 1)));
    for (let i = 0; i < layers.length - 1; i++)
      ys[i].forEach(ya => ys[i + 1].forEach(yb =>
        line(g, `M ${xs[i]} ${ya} L ${xs[i + 1]} ${yb}`, c, i === hot ? 1.9 : .9, { opacity: i === hot ? 1 : .55 })));
    ys.forEach((col, i) => col.forEach(y => dot(g, xs[i], y, 3.6, c, i === layers.length - 1 || i === 0)));
    return { xs, ys };
  };
  const tree = (g, c, leaf) => {
    const L = [[-21, 12], [-7, 12], [7, 12], [21, 12]];
    line(g, 'M 0 -14 L -14 -1 M 0 -14 L 14 -1 M -14 -1 L -21 12 M -14 -1 L -7 12 M 14 -1 L 7 12 M 14 -1 L 21 12', c, 1.4);
    dot(g, 0, -14, 4, c); dot(g, -14, -1, 3.4, c); dot(g, 14, -1, 3.4, c);
    L.forEach(([x, y], k) => leaf(x, y, k));
  };
  const G = {
    sr: (g, c) => {   // expression tree
      line(g, 'M 0 -13 L -15 1 M 0 -13 L 15 1 M 15 1 L 7 14 M 15 1 L 23 14', c, 1.4);
      [[0, -13, '+'], [-15, 1, 'x'], [15, 1, '×'], [7, 14, 'a'], [23, 14, 'eˣ']].forEach(([x, y, s], k) => {
        el('circle', { cx: x, cy: y, r: 7, fill: k ? v('card') : c, stroke: c, 'stroke-width': 1.4 }, g);
        const t = el('text', { x, y: y + 3.6, 'text-anchor': 'middle', style: `font-size:${s.length > 1 ? 7.5 : 10}px;font-weight:700;fill:${k ? c : v('card')}` }, g);
        t.textContent = s;
      });
    },
    add: (g, c) => {   // Σ of small terms
      const t = el('text', { x: -18, y: 9, 'text-anchor': 'middle', style: `font-size:28px;fill:${c};font-family:serif` }, g);
      t.textContent = 'Σ';
      line(g, 'M -2 -12 q 7 -8 14 0 t 14 0', c, 1.6);
      line(g, 'M -2 1 l 28 -6', c, 1.6);
      line(g, 'M -2 14 q 14 -14 28 0', c, 1.6);
    },
    sup: (g, c) => {   // shifted curves collapse onto one master curve
      [-12, -6, 0].forEach((s, k) => line(g, `M ${-30 + s} 14 C ${-20 + s} 14 ${-18 + s} -14 ${-6 + s} -14`, c, 1.2, { opacity: .45 + .2 * k }));
      line(g, 'M 2 0 l 9 0', c, 1.4, { 'marker-end': 'url(#arr)' });
      line(g, 'M 14 14 C 22 14 22 -14 30 -14', c, 2.6);
    },
    rsm: (g, c) => {   // contours around a stationary point
      [[24, 14, .4], [17, 10, .6], [10, 6, .85]].forEach(([rx, ry, o]) =>
        el('ellipse', { cx: 0, cy: 0, rx, ry, transform: 'rotate(-20)', fill: 'none', stroke: c, 'stroke-width': 1.5, opacity: o }, g));
      dot(g, 0, 0, 2.6, c);
    },
    bma: (g, c) => {   // many equations, one weighted average
      [[-12, .35], [-6, .5], [6, .5], [12, .35]].forEach(([d, o]) =>
        line(g, `M -28 12 Q 0 ${-14 + d} 28 ${-6 + d}`, c, 1.1, { opacity: o }));
      line(g, 'M -28 12 Q 0 -14 28 -6', c, 2.6);
    },
    scls: (g, c) => {   // two classes and a curved boundary
      line(g, 'M -24 16 C -10 4 4 -2 26 -16', c, 2.2);
      [[-22, -10], [-12, -14], [-20, 2], [-4, -8], [6, -16]].forEach(([x, y]) => dot(g, x, y, 3, c));
      [[2, 12], [14, 4], [22, 12], [12, 16], [24, -2]].forEach(([x, y]) => dot(g, x, y, 3, c, false));
    },
    ibart: (g, c) => {   // a small forest of trees screens operator-built features down to one
      [-24, -12, 0].forEach(x => {
        line(g, `M ${x} -6 L ${x - 5} 6 M ${x} -6 L ${x + 5} 6`, c, 1.2, { opacity: .8 });
        dot(g, x, -6, 2.6, c); dot(g, x - 5, 6, 2, c, false); dot(g, x + 5, 6, 2, c, false);
      });
      line(g, 'M 7 0 l 6 0', c, 1.4, { 'marker-end': 'url(#arr)' });
      el('rect', { x: 15, y: -9, width: 15, height: 18, rx: 3, fill: c, opacity: .2, stroke: c, 'stroke-width': 1.4 }, g);
      const t = el('text', { x: 22.5, y: 4, 'text-anchor': 'middle', style: `font-size:11px;font-weight:700;font-style:italic;fill:${c};font-family:serif` }, g);
      t.textContent = 'φ';
    },
    sisso: (g, c) => {   // a huge feature space, a few selected
      for (let i = 0; i < 7; i++) for (let j = 0; j < 4; j++) {
        const on = (i === 2 && j === 1) || (i === 5 && j === 3);
        el('rect', { x: -27 + i * 8, y: -15 + j * 8, width: 6, height: 6, rx: 1, fill: on ? c : 'none', stroke: c,
                     'stroke-width': 1, opacity: on ? 1 : .45 }, g);
      }
    },
    reg: (g, c) => {   // data, fit and a confidence band
      el('path', { d: 'M -28 12 L 28 -14 L 28 -4 L -28 18 Z', fill: c, opacity: .16 }, g);
      el('path', { d: 'M -28 6 L 28 -20 L 28 -12 L -28 12 Z', fill: c, opacity: .16 }, g);
      line(g, 'M -28 12 L 28 -12', c, 2.2);
      [[-22, 14], [-12, 4], [-2, 4], [8, -6], [18, -6], [24, -16]].forEach(([x, y]) => dot(g, x, y, 2.4, c));
    },
    ldt: (g, c) => tree(g, c, (x, y, k) => line(g, `M ${x - 5} ${y + 4 - 2 * k} L ${x + 5} ${y - 4 + 2 * k}`, c, 2.2)),
    hyp: (g, c) => {   // oblique splits of the input space
      el('rect', { x: -24, y: -16, width: 48, height: 32, rx: 3, fill: 'none', stroke: c, 'stroke-width': 1.4 }, g);
      el('path', { d: 'M -24 8 L 10 -16 L 24 -16 L 24 16 L -24 16 Z', fill: c, opacity: .14 }, g);
      el('path', { d: 'M -3 -7 L 24 6 L 24 16 L 6 16 Z', fill: c, opacity: .22 }, g);
      line(g, 'M -24 8 L 10 -16', c, 2); line(g, 'M -3 -7 L 24 6', c, 2); line(g, 'M -11 -1 L 6 16', c, 2);
    },
    dtr: (g, c) => tree(g, c, (x, y, k) => line(g, `M ${x - 6} ${y + 5} C ${x - 3} ${y + 5} ${x - 2} ${y - 6} ${x} ${y - 6} C ${x + 2} ${y - 6} ${x + 3} ${y + 5} ${x + 6} ${y + 5}`, c, 1.6)),
    dtc: (g, c) => tree(g, c, (x, y, k) => dot(g, x, y + 1, 4, c, k % 2 === 0)),
    leaf: (g, c) => {   // a tree's splits, a model in each piece
      line(g, 'M -10 -18 L -10 18 M 10 -18 L 10 18', c, 1, { 'stroke-dasharray': '2 3', opacity: .7 });
      line(g, 'M -28 12 L -12 2', c, 2.4); line(g, 'M -8 -10 Q 0 -2 8 -10', c, 2.4); line(g, 'M 12 14 L 28 10', c, 2.4);
    },
    icnn: (g, c) => { line(g, 'M -26 -16 Q -6 34 26 -16', c, 2.4); dot(g, -3, 8.5, 3, c); },
    mono: (g, c) => {
      line(g, 'M -26 14 C -6 14 -4 -14 24 -14', c, 2.4);
      line(g, 'M 20 12 l 0 -14', c, 1.4, { 'marker-end': 'url(#arr)' });
    },
    per: (g, c) => line(g, 'M -28 0 C -24 -16 -18 -16 -14 0 S -4 16 0 0 S 10 -16 14 0 S 24 16 28 0', c, 2.4),
    kan: (g, c) => {   // learnable functions on the edges
      [-10, 10].forEach(y0 => line(g, `M -22 ${y0} q 5 ${-8} 10 ${-y0 / 4} t 10 ${-y0 / 4} t 10 ${-y0 / 4} t 14 ${-y0 / 4}`, c, 1.5));
      dot(g, -22, -10, 3.6, c); dot(g, -22, 10, 3.6, c); dot(g, 22, 0, 3.6, c);
    },
    kanl: (g, c) => {
      [-10, 10].forEach(y0 => line(g, `M -26 ${y0} q 4 -7 8 ${-y0 / 4} t 8 ${-y0 / 4} t 12 ${-y0 / 2}`, c, 1.5));
      dot(g, -26, -10, 3.4, c); dot(g, -26, 10, 3.4, c); dot(g, 2, 0, 3.6, c);
      el('rect', { x: 12, y: -12, width: 14, height: 24, rx: 7, fill: c, opacity: .2 }, g);
      line(g, 'M 12 0 L 26 0', c, 2);
    },
    zenn: (g, c) => {   // an energy landscape with two wells
      line(g, 'M -28 -14 C -22 16 -12 16 -6 2 C -2 -8 4 -8 8 2 C 14 18 24 14 28 -16', c, 2.2);
      dot(g, -13, 11, 2.6, c); dot(g, 17, 11.5, 2.6, c, false);
    },
    llpr: (g, c) => net(g, [3, 3, 1], c, -24, 24, 26, 1),
    dpose: (g, c) => {
      const { xs, ys } = net(g, [3, 3], c, -26, 4, 26);
      [-15, -5, 5, 15].forEach(y => { line(g, `M 4 0 L 26 ${y}`, c, 1.5); dot(g, 26, y, 2.6, c); });
    },
    kfold: (g, c) => {
      net(g, [3, 3, 4], c, -24, 24, 28, 1);
    },
    nnbr: (g, c) => {
      net(g, [2, 3], c, -28, -6, 22);
      line(g, 'M 0 12 C 8 12 9 -14 15 -14 C 21 -14 22 12 30 12', c, 2.2);
    },
    nngmm: (g, c) => line(g, 'M -28 14 C -20 14 -18 -14 -10 -14 C -2 -14 -2 4 4 4 C 10 4 10 -6 16 -6 C 22 -6 22 14 28 14', c, 2.4),
    flow: (g, c) => {   // a simple density warped into a complicated one
      el('circle', { cx: -18, cy: 0, r: 11, fill: c, opacity: .22, stroke: c, 'stroke-width': 1.4 }, g);
      line(g, 'M -4 0 l 9 0', c, 1.4, { 'marker-end': 'url(#arr)' });
      el('path', { d: 'M 10 -4 C 12 -18 30 -16 26 -6 C 23 2 30 6 26 12 C 20 20 8 14 12 6 C 14 2 9 0 10 -4 Z', fill: c, opacity: .22, stroke: c, 'stroke-width': 1.4 }, g);
    },
    al: (g, c) => {   // a model's band, and the next sample where it is widest
      el('path', { d: 'M -28 4 C -14 0 -4 -2 4 -12 C 14 -24 24 -14 28 -16 L 28 4 C 24 6 14 18 4 6 C -4 -2 -14 10 -28 8 Z', fill: c, opacity: .18 }, g);
      line(g, 'M -28 6 C -14 4 -4 -2 4 -3 C 14 -4 24 -6 28 -6', c, 1.8);
      [[-24, 6], [-14, 5], [-6, 0], [26, -6]].forEach(([x, y]) => dot(g, x, y, 2.2, c));
      el('circle', { cx: 14, cy: -4, r: 6, fill: 'none', stroke: c, 'stroke-width': 1.6 }, g);
      line(g, 'M 14 -14 L 14 6 M 4 -4 L 24 -4', c, 1);
    },
    cmp: (g, c) => {   // intervals side by side
      [[-20, 9], [-7, 14], [6, 6], [19, 11]].forEach(([x, h]) => {
        line(g, `M ${x} ${-h} L ${x} ${h} M ${x - 4} ${-h} L ${x + 4} ${-h} M ${x - 4} ${h} L ${x + 4} ${h}`, c, 1.6);
        dot(g, x, 0, 2.6, c);
      });
    },
  };

  // ---------- layout ----------
  const TW = 118, TH = 116, GAP = 10, X0 = 196, BX = 12, BW = 1216, PAD = 12;
  const nodeG = document.getElementById('nodes');
  const bandG = document.getElementById('bands');
  const pkgG = document.getElementById('pkgs');
  const ALL = [];

  // package header: hover lights that package's models
  const PK = ['jaxsr', 'ibart', 'ldt', 'difftree', 'pycse'];
  PK.forEach((k, i) => {
    const p = PKG[k], w = 230, x = 14 + i * (w + 16), y = 10;
    p.id = `pkg-${k}`; p.pkg = k; p.isPkg = true;
    p.count = Object.values(M).filter(m => m.pkg === k).length;
    const g = el('g', { class: 'pkg', id: p.id, tabindex: 0, role: 'button', 'aria-label': `${p.name}: ${p.kind}` }, pkgG);
    p.g = g;
    el('rect', { x, y, width: w, height: 46, rx: 23, fill: v('card'), stroke: v(p.color), 'stroke-width': 1.4, class: 'pkg-box' }, g);
    el('image', { href: p.logo, x: x + 10, y: y + 7, width: 32, height: 32 }, g);
    const t = el('text', { x: x + 52, y: y + 21, style: `font-size:15px;font-weight:700;fill:${v(p.color)}` }, g);
    t.textContent = p.name;
    const s = el('text', { x: x + 52, y: y + 37, class: 'lbl', style: 'font-size:11.5px' }, g);
    s.textContent = `${p.short} · ${p.count} model${p.count === 1 ? '' : 's'}`;
    ALL.push(p);
  });

  let y = 70;
  FAM.forEach(f => {
    const h = PAD * 2 + f.rows.length * TH + (f.rows.length - 1) * GAP;
    el('rect', { x: BX, y, width: BW, height: h, rx: 14, fill: v(`${f.id}-soft`) }, bandG);
    const t = el('text', { x: 28, y: y + 34, class: 'fam', style: `fill:${v(f.id)}` }, bandG);
    t.textContent = f.name;
    f.lines.forEach((s, k) => {
      const d = el('text', { x: 28, y: y + 56 + k * 16, class: 'lbl' }, bandG);
      d.textContent = s;
    });
    f.rows.forEach((row, r) => {
      const top = y + PAD + r * (TH + GAP);
      row.forEach((id, i) => {
        const m = M[id];
        m.fam = f.id;
        const cx = X0 + i * (TW + GAP) + TW / 2;
        // the shared tools sit after a gap, apart from the model
        const sx = m.tool ? cx + 26 : cx;
        drawTile(m, sx, top);
      });
    });
    if (f.id === 'dist') {
      const xs = X0 + TW + GAP + 12;
      el('path', { d: `M ${xs} ${y + 14} L ${xs} ${y + h - 14}`, stroke: v('rule'), 'stroke-width': 1.4 }, bandG);
      const a = el('text', { x: xs - 8, y: y + h / 2, class: 'lbl', 'text-anchor': 'middle', style: 'font-weight:650',
                             transform: `rotate(-90 ${xs - 8} ${y + h / 2})` }, bandG);
      a.textContent = 'Across the zoo';
      f.legendY = y;
    }
    y += h + 12;
  });

  function drawTile(m, cx, top) {
    const fam = m.tool ? 'muted' : m.fam;
    const g = el('g', { class: `node${m.nbs.length ? '' : ' todo'}`, id: `n-${m.id}`, transform: `translate(${cx} ${top})`,
                        tabindex: 0, role: 'button', 'aria-label': `${m.name.replace('\n', ' ')}: ${m.cls}` }, nodeG);
    m.g = g;
    el('rect', { x: -TW / 2, y: 0, width: TW, height: TH, rx: 12, class: 'card', fill: v('card'),
                 stroke: m.tool ? v('card-edge') : v(m.fam) }, g);
    G[m.id](el('g', { class: 'glyph', transform: 'translate(0 34)' }, g), v(m.tool ? 'muted' : m.fam));
    const lines = m.name.split('\n');
    lines.forEach((s, k) => {
      const t = el('text', { x: 0, y: (lines.length > 1 ? 74 : 81) + k * 14, class: 'name', style: `fill:${v('ink')}` }, g);
      t.textContent = s;
    });
    // package pill
    const p = PKG[m.pkg], label = m.tool ? 'several packages' : p.name, pw = label.length * 6.1 + 14;
    el('rect', { x: -pw / 2, y: TH - 22, width: pw, height: 15, rx: 7.5, fill: v(p.color) }, g);
    const pt = el('text', { x: 0, y: TH - 11, class: 'pill-txt' }, g);
    pt.textContent = label;
    if (m.opt) {
      const b = el('text', { x: TW / 2 - 10, y: 16, 'text-anchor': 'middle', style: `font-size:12px;fill:${v(m.fam)}` }, g);
      b.textContent = '◆';
      el('title', {}, b).textContent = 'Embeds exactly in an optimization model';
    }
    ALL.push(m);
  }

  // ---------- legend ----------
  {
    const L = el('g', { transform: `translate(${X0 + 4 * (TW + GAP) + 50} ${FAM[3].legendY + 26})` }, document.getElementById('legend'));
    const h = el('text', { x: 0, y: 0, class: 'lbl', style: 'font-weight:650' }, L);
    h.textContent = 'Reading the tiles';
    const rows = [
      [g => { const b = el('text', { x: 13, y: 5, 'text-anchor': 'middle', style: `font-size:13px;fill:${v('sym')}` }, g); b.textContent = '◆'; },
       'embeds exactly in an optimizer (algebraic, MILP or convex)'],
      [g => el('rect', { x: 0, y: -9, width: 26, height: 18, rx: 5, fill: 'none', stroke: v('muted'), 'stroke-dasharray': '5 4', 'stroke-width': 1.4 }, g),
       'dashed: no example notebook yet'],
      [g => { el('rect', { x: 0, y: -7.5, width: 26, height: 15, rx: 7.5, fill: v('pycse') }, g); },
       'pill: the package it lives in'],
      [g => { const t = el('text', { x: 13, y: 5, 'text-anchor': 'middle', style: `font-size:12px;font-weight:700;fill:${v('muted')}` }, g); t.textContent = 'σ'; },
       'each tooltip says how that model gets its uncertainty'],
    ];
    rows.forEach(([icon, label], i) => {
      const r = el('g', { transform: `translate(0 ${24 + i * 22})` }, L);
      icon(r);
      const t = el('text', { x: 38, y: 4.5, class: 'lbl' }, r);
      t.textContent = label;
    });
  }

  // ---------- interaction ----------
  const svg = document.getElementById('map');
  const tip = document.getElementById('tip');
  const wrap = document.getElementById('wrap');
  let pinned = null, hideTimer = null;

  const highlight = n => {
    svg.classList.add('focus');
    const lit = n.isPkg ? ALL.filter(m => m.pkg === n.pkg) : [n, PKG[n.pkg]];
    ALL.forEach(m => m.g.classList.toggle('lit', lit.includes(m)));
  };
  const unhighlight = () => {
    svg.classList.remove('focus');
    svg.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
  };

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const a = ([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`;
  const show = n => {
    clearTimeout(hideTimer);
    if (n.isPkg) {
      tip.style.setProperty('--accent', v(n.color));
      const models = ALL.filter(m => m.pkg === n.pkg && !m.isPkg).map(m => m.name.replace('\n', ' ')).join(', ');
      tip.innerHTML = `<div class="t-name">${esc(n.name)}</div>
        <div class="t-kind">${esc(n.kind)}</div>
        <p>${esc(n.what)}</p>
        <dl><dt>Models</dt><dd>${esc(models)}</dd></dl>
        <h4>Links</h4><ul>${n.links.map(a).join('')}</ul>`;
    } else {
      tip.style.setProperty('--accent', v(n.tool ? 'muted' : n.fam));
      const p = PKG[n.pkg];
      const nbs = n.nbs.map(a).join('') + (n.nbs.length ? '' : '<li class="gap">None yet: a notebook to write.</li>')
        + (n.note ? `<li class="gap">${esc(n.note)}</li>` : '');
      tip.innerHTML = `<div class="t-name">${esc(n.name.replace('\n', ' '))}</div>
        <div class="t-kind"><code>${esc(n.cls)}</code></div>
        <dl><dt>${n.tool ? 'Where' : 'Package'}</dt><dd>${n.tool ? esc(n.fw) : `${esc(p.name)} · ${esc(n.fw)}`}</dd>
            <dt>What</dt><dd>${esc(n.what)}</dd>
            <dt>${n.tool ? 'Needs' : 'Uncertainty'}</dt><dd>${esc(n.uq)}</dd>
            ${n.opt ? `<dt>Optimize</dt><dd>${esc(n.opt)}</dd>` : ''}</dl>
        <h4>Example notebooks</h4><ul>${nbs}</ul>
        ${n.code ? `<h4>Code</h4><ul>${a(['Source', n.code])}</ul>` : ''}`;
    }
    tip.classList.add('show');
    const r = n.g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left - w.left + r.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, w.width - tw - 8));
    let top = r.bottom - w.top + 8;
    if (top + th > w.height) {
      if (r.top - w.top - th - 8 > 0) top = r.top - w.top - th - 8;
      else {   // no room above or below: beside the tile, inside the frame
        top = Math.min(r.top - w.top, w.height - th);
        left = r.right - w.left + tw + 16 < w.width ? r.right - w.left + 8 : r.left - w.left - tw - 8;
      }
    }
    tip.style.left = `${left}px`; tip.style.top = `${Math.max(0, top)}px`;
    ALL.forEach(m => m.g.classList.toggle('active', m === n));
    highlight(n);
  };
  const hide = () => {
    if (pinned) return;
    hideTimer = setTimeout(() => {
      tip.classList.remove('show');
      ALL.forEach(m => m.g.classList.remove('active'));
      unhighlight();
    }, 180);
  };

  ALL.forEach(n => {
    n.g.addEventListener('mouseenter', () => { if (!pinned) show(n); });
    n.g.addEventListener('mouseleave', hide);
    n.g.addEventListener('focus', () => { if (!pinned) show(n); });
    n.g.addEventListener('blur', hide);
    n.g.addEventListener('click', e => {
      e.stopPropagation();
      pinned = pinned === n ? null : n;
      show(n);
    });
    n.g.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinned = n; show(n); }
    });
  });
  tip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  tip.addEventListener('mouseleave', hide);
  const unpin = () => {
    pinned = null; tip.classList.remove('show');
    ALL.forEach(m => m.g.classList.remove('active'));
    unhighlight();
  };
  document.addEventListener('click', e => { if (!tip.contains(e.target)) unpin(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });
})();
</script>
</body>
</html>
