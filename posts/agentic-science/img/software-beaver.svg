<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Helvetica, Arial, sans-serif">
  <!-- sky and pond -->
  <rect width="520" height="340" fill="#f5f2ee"/>
  <circle cx="450" cy="58" r="26" fill="#f4c66b" opacity=".85"/>
  <path d="M0 250 Q130 236 260 250 T520 248 V340 H0 Z" fill="#9cc7d8"/>
  <path d="M0 270 Q120 262 240 272 T520 268" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M30 300 q30 -8 60 0 M330 305 q30 -8 60 0" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>

  <!-- timeline -->
  <g stroke="#9b1c31" stroke-width="2.5" fill="none">
    <path d="M28 236 V58"/>
    <path d="M20 68 L28 54 L36 68" stroke-linejoin="round"/>
  </g>
  <text x="40" y="52" font-size="15" font-weight="700" fill="#9b1c31">30+ years</text>
  <text x="40" y="236" font-size="12" fill="#7a6a5a">then</text>
  <text x="40" y="70" font-size="12" fill="#7a6a5a">now</text>

  <!-- the dam: logs of tools, oldest at the bottom -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <g transform="translate(90 214)">
      <rect width="230" height="30" rx="15" fill="#8a5a33" stroke="#5c3a1e" stroke-width="2"/>
      <ellipse cx="230" cy="15" rx="9" ry="15" fill="#d9b382" stroke="#5c3a1e" stroke-width="2"/>
      <text x="112" y="20">Matlab · Python · vasp.py</text>
    </g>
    <g transform="translate(100 182)">
      <rect width="210" height="30" rx="15" fill="#9a6639" stroke="#5c3a1e" stroke-width="2"/>
      <ellipse cx="210" cy="15" rx="9" ry="15" fill="#d9b382" stroke="#5c3a1e" stroke-width="2"/>
      <text x="102" y="20">dft-book · pycse</text>
    </g>
    <g transform="translate(110 150)">
      <rect width="190" height="30" rx="15" fill="#8a5a33" stroke="#5c3a1e" stroke-width="2"/>
      <ellipse cx="190" cy="15" rx="9" ry="15" fill="#d9b382" stroke="#5c3a1e" stroke-width="2"/>
      <text x="92" y="20">Emacs · org-ref · scimax</text>
    </g>
    <g transform="translate(122 118)">
      <rect width="166" height="30" rx="15" fill="#9a6639" stroke="#5c3a1e" stroke-width="2"/>
      <ellipse cx="166" cy="15" rx="9" ry="15" fill="#d9b382" stroke="#5c3a1e" stroke-width="2"/>
      <text x="80" y="20">scimax for VS Code</text>
    </g>
    <g transform="translate(134 86)">
      <rect width="142" height="30" rx="15" fill="#9b1c31" stroke="#5e0f1d" stroke-width="2"/>
      <ellipse cx="142" cy="15" rx="9" ry="15" fill="#e9a3ae" stroke="#5e0f1d" stroke-width="2"/>
      <text x="68" y="20">pounce · discopt</text>
    </g>
  </g>
  <!-- code bits stuck in the dam -->
  <g font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#5c3a1e">
    <text x="78" y="208">{</text><text x="336" y="240">}</text>
    <text x="96" y="144">&lt;/&gt;</text>
  </g>
  <g transform="translate(300 152)" fill="#6b6b6b">
    <circle r="11"/><circle r="4" fill="#f5f2ee"/>
    <g stroke="#6b6b6b" stroke-width="5"><path d="M0 -14 V14 M-14 0 H14 M-10 -10 L10 10 M-10 10 L10 -10"/></g>
    <circle r="4" fill="#f5f2ee"/>
  </g>

  <!-- laptop on top of the dam -->
  <g transform="translate(176 60)">
    <rect x="4" y="0" width="50" height="26" rx="3" fill="#33363d"/>
    <rect x="8" y="4" width="42" height="18" fill="#cfe6f0"/>
    <path d="M12 9 h14 M12 13 h22 M12 17 h10" stroke="#9b1c31" stroke-width="2"/>
    <path d="M0 26 h58 l-4 4 h-50 z" fill="#5b5f68"/>
  </g>

  <!-- beaver -->
  <g transform="translate(380 120)">
    <!-- tail -->
    <ellipse cx="62" cy="116" rx="40" ry="17" transform="rotate(-18 62 116)" fill="#5a4637" stroke="#3a2a1e" stroke-width="2.5"/>
    <path d="M36 112 L88 104 M40 122 L90 112 M50 102 L58 128 M66 98 L74 124" stroke="#3a2a1e" stroke-width="1.5" opacity=".6"/>
    <!-- body -->
    <ellipse cx="18" cy="84" rx="46" ry="54" fill="#a26b3f" stroke="#5c3a1e" stroke-width="2.5"/>
    <ellipse cx="10" cy="92" rx="28" ry="38" fill="#d7a874"/>
    <!-- feet -->
    <ellipse cx="-8" cy="136" rx="17" ry="8" fill="#3a2a1e"/>
    <ellipse cx="34" cy="136" rx="17" ry="8" fill="#3a2a1e"/>
    <!-- head -->
    <circle cx="4" cy="16" r="40" fill="#a26b3f" stroke="#5c3a1e" stroke-width="2.5"/>
    <circle cx="-26" cy="-16" r="11" fill="#a26b3f" stroke="#5c3a1e" stroke-width="2.5"/>
    <circle cx="32" cy="-18" r="11" fill="#a26b3f" stroke="#5c3a1e" stroke-width="2.5"/>
    <circle cx="-26" cy="-16" r="5" fill="#7a4a2a"/>
    <circle cx="32" cy="-18" r="5" fill="#7a4a2a"/>
    <!-- muzzle -->
    <ellipse cx="-8" cy="32" rx="22" ry="16" fill="#e2bb8c"/>
    <ellipse cx="-10" cy="22" rx="8" ry="5.5" fill="#2b1d14"/>
    <path d="M-10 28 v6 M-10 34 q-8 4 -12 -1 M-10 34 q8 4 12 -1" stroke="#2b1d14" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- teeth -->
    <rect x="-17" y="36" width="7" height="11" rx="1.5" fill="#fff" stroke="#5c3a1e" stroke-width="1.5"/>
    <rect x="-10" y="36" width="7" height="11" rx="1.5" fill="#fff" stroke="#5c3a1e" stroke-width="1.5"/>
    <!-- glasses and eyes -->
    <circle cx="-22" cy="4" r="5" fill="#2b1d14"/><circle cx="-20.5" cy="2.5" r="1.6" fill="#fff"/>
    <circle cx="14" cy="2" r="5" fill="#2b1d14"/><circle cx="15.5" cy=".5" r="1.6" fill="#fff"/>
    <g fill="none" stroke="#2b1d14" stroke-width="2.5">
      <circle cx="-22" cy="4" r="12"/><circle cx="14" cy="2" r="12"/>
      <path d="M-10 3 q6 -4 12 -2"/>
    </g>
    <!-- cheeks -->
    <ellipse cx="-36" cy="22" rx="6" ry="4" fill="#e98b8b" opacity=".55"/>
    <ellipse cx="30" cy="20" rx="6" ry="4" fill="#e98b8b" opacity=".55"/>
    <!-- arms carrying the next log -->
    <g transform="translate(-92 64) rotate(-8)">
      <rect width="120" height="22" rx="11" fill="#c08a52" stroke="#5c3a1e" stroke-width="2"/>
      <ellipse cx="0" cy="11" rx="7" ry="11" fill="#e9cfa6" stroke="#5c3a1e" stroke-width="2"/>
      <text x="64" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">next tool…</text>
    </g>
    <ellipse cx="-74" cy="76" rx="10" ry="8" fill="#a26b3f" stroke="#5c3a1e" stroke-width="2"/>
    <ellipse cx="18" cy="58" rx="10" ry="8" fill="#a26b3f" stroke="#5c3a1e" stroke-width="2"/>
  </g>
</svg>
