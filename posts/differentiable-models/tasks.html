<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Model, Many Tasks</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1b1f3b;
    --muted: #5d6280;
    --rule: #d9dcea;
    --card: #ffffff;
    --card-edge: #c9cde0;
    --model: #23286b;
    --model-soft: #eef0fb;
    --data: #0f766e;
    --tip-bg: #ffffff;
    --tip-shadow: 0 6px 24px rgba(20, 24, 60, .18);
    /* one hue per task, after the sketch: accent for ink, soft for fill */
    --opt: #2f7d3a;   --opt-soft: #dcf0d6;
    --rec: #be3a63;   --rec-soft: #fde7ea;
    --est: #2f63c4;   --est-soft: #dde7f4;
    --plan: #9b37a0;  --plan-soft: #f3dcf3;
    --sim: #c4501f;   --sim-soft: #fde1d5;
    --ctl: #a8690c;   --ctl-soft: #fdeecb;
    --doe: #555a73;   --doe-soft: #e6e6ea;
    --uq: #85613a;    --uq-soft: #efe5d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131c; --ink: #e8e9f3; --muted: #a2a6c2; --rule: #2e3146;
      --card: #1c1e2c; --card-edge: #393c56;
      --model: #aab3ff; --model-soft: #1d2140; --data: #4fd1c5;
      --tip-bg: #1f2130; --tip-shadow: 0 6px 24px rgba(0, 0, 0, .5);
      --opt: #7fd18a;  --opt-soft: #17291a;
      --rec: #f08aa9;  --rec-soft: #331a22;
      --est: #85aaf5;  --est-soft: #19233a;
      --plan: #e290e6; --plan-soft: #2d1a2e;
      --sim: #f79a72;  --sim-soft: #331e15;
      --ctl: #f2c062;  --ctl-soft: #302512;
      --doe: #b4b8cf;  --doe-soft: #26283a;
      --uq: #d6b48c;   --uq-soft: #2c2318;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131c; --ink: #e8e9f3; --muted: #a2a6c2; --rule: #2e3146;
    --card: #1c1e2c; --card-edge: #393c56;
    --model: #aab3ff; --model-soft: #1d2140; --data: #4fd1c5;
    --tip-bg: #1f2130; --tip-shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --opt: #7fd18a;  --opt-soft: #17291a;
    --rec: #f08aa9;  --rec-soft: #331a22;
    --est: #85aaf5;  --est-soft: #19233a;
    --plan: #e290e6; --plan-soft: #2d1a2e;
    --sim: #f79a72;  --sim-soft: #331e15;
    --ctl: #f2c062;  --ctl-soft: #302512;
    --doe: #b4b8cf;  --doe-soft: #26283a;
    --uq: #d6b48c;   --uq-soft: #2c2318;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { position: relative; max-width: 1240px; margin: 0 auto; padding: 8px 16px 16px; }
  svg { display: block; width: 100%; height: auto; }

  svg text { fill: var(--ink); font-family: inherit; }
  .math { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: italic; }
  .lbl { font-size: 12.5px; fill: var(--muted); }
  .name { font-size: 17px; font-weight: 650; }
  .chip-txt { font-size: 14px; text-anchor: middle; }
  .elbl { font-size: 14px; }

  .node { cursor: pointer; outline: none; transition: opacity .15s; }
  .node .card { stroke-width: 1.4; }
  .node:hover .card, .node:focus-visible .card, .node.active .card { stroke-width: 2.6; }
  .sat .card { stroke-dasharray: 5 4; }

  .edge { fill: none; stroke-width: 2.2; transition: opacity .15s; }
  .tether { fill: none; stroke-width: 1.4; stroke-dasharray: 3 4; }
  .loop-step { cursor: pointer; }
  .loop-step:hover rect, .loop-step.on rect { stroke-width: 2.4; }

  svg.focus .node:not(.lit), svg.focus .edge:not(.lit), svg.focus .elbl:not(.lit),
  svg.focus .tether:not(.lit) { opacity: .16; }

  .tip {
    position: absolute; z-index: 5; width: 330px; max-width: calc(100% - 32px);
    background: var(--tip-bg); color: var(--ink); border: 1px solid var(--card-edge);
    border-top: 4px solid var(--accent, var(--card-edge));
    border-radius: 10px; box-shadow: var(--tip-shadow); padding: 12px 14px;
    font-size: 14px; display: none;
  }
  .tip.show { display: block; }
  .tip .t-name { font-weight: 700; font-size: 16px; }
  .tip .t-kind { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .tip p { margin: 0 0 8px; }
  .tip dl { margin: 0 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  .tip dt { font-weight: 650; color: var(--muted); font-size: 12.5px; padding-top: 1px; }
  .tip dd { margin: 0; }
  .tip .t-obj { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; }
  .tip h4 { margin: 8px 0 3px; font-size: 12.5px; color: var(--muted); font-weight: 650; }
  .tip ul { margin: 0; padding-left: 16px; }
  .tip li { margin: 1px 0; }
  .tip a { color: var(--accent, var(--model)); font-weight: 600; text-decoration: none; }
  .tip a:hover { text-decoration: underline; }
  .tip .gap { color: var(--muted); font-style: italic; }
  .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <svg id="map" viewBox="0 0 1240 864" role="img"
       aria-labelledby="map-title map-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="map-title">One differentiable model, many tasks</title>
    <desc id="map-desc">A single differentiable model f(x; θ) in the center. Around it, the tasks
      that reuse it: simulation, parameter estimation, data reconciliation, planning, control,
      design of experiments, optimization, and sensitivity and uncertainty quantification. Each task
      fixes some of x, θ and y, frees the rest, and adds an objective. Dashed satellites are related
      tasks we want to cover. A strip along the bottom shows the digital-twin loop through the tasks.</desc>
    <defs id="defs"></defs>
    <g id="edges"></g>
    <g id="nodes"></g>
    <g id="legend"></g>
    <g id="loop"></g>
  </svg>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="hint">Hover or tap a box for what you have, what you want, and example notebooks. Click a step in the loop to follow it.</div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const DISCOPT = 'https://github.com/jkitchin/discopt/blob/main/docs/notebooks';
  const DOE = 'https://github.com/jkitchin/discopt-doe/blob/main/docs/notebooks';
  const DIFFLOW = 'https://github.com/jkitchin/differentiable-flowsheets/blob/main';
  const dc = (f, t) => [t, `${DISCOPT}/${f}.ipynb`];
  const dd = (f, t) => [t, `${DOE}/${f}.ipynb`];
  const df = (f, t) => [t, `${DIFFLOW}/examples/${f}.ipynb`];
  const dfdoc = (f, t) => [`${t} (docs page, no notebook)`, `${DIFFLOW}/docs/${f}.md`];

  // ---------- geometry ----------
  const C = { x: 620, y: 372 };               // the model
  const MW = 236, MH = 150;                   // model box
  const TW = 214, TH = 92;                    // task card
  const SW = 168, SH = 50;                    // satellite card
  const at = (deg, rx = 432, ry = 262) => ({ x: C.x + rx * Math.cos(deg * Math.PI / 180),
                                             y: C.y - ry * Math.sin(deg * Math.PI / 180) });

  // Roles of x (inputs, conditions, decisions), θ (parameters) and y (outputs, states):
  //   g given, d from data, s sought, u uncertain (a distribution), c computed along the way
  const ROLE = {
    g: 'given', d: 'from data', s: 'sought', u: 'uncertain', c: 'computed',
  };

  // ---------- tasks ----------
  const T = [
    { id: 'opt', name: 'Optimization', deg: 90, roles: 'sgc', edge: 'min g(x)',
      kind: 'Find the best operating or design point',
      have: 'A calibrated model (θ fixed), an objective such as cost or yield, and constraints.',
      want: 'The decisions x* that minimize the objective while the model holds.',
      obj: 'min_x  g(x, f(x; θ))  s.t.  h(x, y) ≤ 0',
      discopt: [dc('quickstart', 'Quickstart'), dc('tutorial_minlp', 'MINLP tutorial'),
                dc('cstr_fit_doe_optimize', 'One model, four jobs (§7)')],
      difflow: [df('03_optimization', '03 Optimization'), df('27_pounce_optimization', '27 Optimization with pounce'),
                df('17_superstructure_optimization', '17 Superstructure optimization')] },
    { id: 'rec', name: 'Data reconciliation', deg: 36, roles: 'dgs', edge: 'data',
      kind: 'Make the measurements agree with the model',
      have: 'Noisy, redundant plant measurements ŷ with their σ, and a model taken as correct.',
      want: 'The smallest weighted adjustment to ŷ that satisfies the model exactly, estimates of unmeasured streams, and flags on gross errors.',
      obj: 'min_y  Σ ((y − ŷ)/σ)²  s.t.  y = f(x; θ)',
      discopt: [],
      difflow: [df('28_data_reconciliation', '28 Data reconciliation'), df('29_model_updating', '29 Updating a model from plant data')] },
    { id: 'est', name: 'Parameter estimation', deg: -6, roles: 'dsd', edge: 'data · min_θ loss',
      kind: 'Calibrate the model to data',
      have: 'Experiments: the conditions x and the measured outputs y.',
      want: 'Parameters θ that best explain the data, and their covariance.',
      obj: 'min_θ  Σ ((y − f(x; θ))/σ)²',
      discopt: [dc('tutorial_estimation', 'Parameter estimation'), dc('cstr_fit_doe_optimize', 'One model, four jobs (§4)'),
                dc('tutorial_dae', 'DAE collocation (§4)')],
      difflow: [df('14_parameter_estimation', '14 Parameter estimation'), df('22_estimation_module', '22 difflow.estimation')] },
    { id: 'plan', name: 'Planning', deg: -44, roles: 'sgd', edge: 'data · Δ',
      kind: 'Decide over periods with a linearized model',
      have: 'Prices, demands and capacities (data), plus a base point and its Jacobian Δ = ∂y/∂x taken from the model.',
      want: 'A plan over periods: feeds, modes, the product slate. The derivatives replace hand-maintained delta vectors.',
      obj: 'max_x  margin  s.t.  y ≈ y₀ + Δ (x − x₀)',
      discopt: [],
      discoptNote: 'The multi-period example in discopt-grid is private.',
      difflow: [df('30_delta_base_planning', '30 Delta-base planning'), df('35_refinery_cdu_planning', '35 The crude unit as a planning block')] },
    { id: 'sim', name: 'Simulation', deg: -90, roles: 'ggs', edge: 'x, θ',
      kind: 'Predict what the system does',
      have: 'Inputs x and parameters θ.',
      want: 'The outputs y, steady state or a trajectory in time. No degrees of freedom are left.',
      obj: 'solve  f(x; θ) for y  (no objective)',
      discopt: [dc('cstr_fit_doe_optimize', 'One model, four jobs (§2)'), dc('tutorial_dae', 'DAE collocation')],
      difflow: [df('00_cstr_pfr_basics', '00 CSTR and PFR basics'), df('01_cstr_flash_recycle', '01 CSTR, flash and recycle'),
                df('11_dynamic_modeling', '11 Dynamic modeling')] },
    { id: 'uq', name: 'Sensitivity & UQ', deg: -136, roles: 'gus', edge: '∂y/∂θ · Σ_θ',
      kind: 'How much do the answers move, and how sure are we?',
      have: 'θ with its covariance Σθ from estimation, and the conditions x of interest.',
      want: 'Derivatives ∂y/∂θ and ∂x*/∂θ, prediction intervals, and which parameters matter.',
      obj: 'Σ_y ≈ J Σ_θ Jᵀ,  or bootstrap / Monte Carlo through f',
      discopt: [dc('sensitivity_analysis', 'Parametric sensitivity (sIPOPT)'), dc('model_derivatives', 'Derivatives of models'),
                dc('tutorial_pounce_sipopt', 'pounce sIPOPT sensitivity')],
      difflow: [df('02_cstr_sensitivity', '02 CSTR sensitivity'), df('06_uncertainty_propagation', '06 Uncertainty propagation'),
                df('23_estimation_bootstrap_cv', '23 Bootstrap and cross-validation')] },
    { id: 'ctl', name: 'Control', deg: 180, roles: 'sgd', edge: 'data · goal',
      kind: 'Steer the system toward a goal',
      have: 'The current state, estimated from data, and a goal: a setpoint or trajectory.',
      want: 'The input trajectory u(t) over a horizon, re-solved as new data arrive (model predictive control).',
      obj: 'min_u ∫ ‖y − y_sp‖² + ‖Δu‖²  s.t.  dynamic f',
      discopt: [dc('tutorial_dae', 'DAE collocation (§5 optimal control)')],
      discoptNote: 'Open-loop optimal control only. No receding-horizon MPC example yet.',
      difflow: [dfdoc('operability', 'Operability and controllability screening')],
      difflowNote: 'No control notebook yet.' },
    { id: 'doe', name: 'Design of experiments', deg: 136, roles: 'suc', edge: 'max info(x)',
      kind: 'Choose the most informative next experiment',
      have: 'The model, the current θ estimate and its covariance, and the space of experiments you could run.',
      want: 'The next experiment(s) x that shrink the uncertainty in θ the most.',
      obj: 'max_x  log det F(x; θ)   (D-optimal, F = Fisher information)',
      discopt: [dd('tutorial_doe', 'discopt-doe: model-based DOE'), dd('tutorial_batch_doe', 'discopt-doe: batch DOE'),
                dc('cstr_fit_doe_optimize', 'One model, four jobs (§6)')],
      difflow: [dfdoc('experiment-design', 'Experiment design and identifiability')],
      difflowNote: 'No notebook yet.' },
  ];

  // ---------- satellites: related tasks we want to cover ----------
  const S = [
    { id: 'mhe', parent: 'ctl', name: 'State estimation', off: { x: 0, y: 112 }, roles: 'gds',
      kind: 'Moving-horizon estimation',
      have: 'A window of noisy, possibly late measurements, the inputs, and a dynamic model.',
      want: 'The current hidden states, and slowly drifting parameters, to hand to control.',
      obj: 'min over the window  ‖ŷ − y‖²_R + ‖w‖²_Q',
      discopt: [],
      difflow: [dfdoc('moving-horizon-estimation', 'Moving-horizon estimation')], difflowNote: 'No notebook yet.' },
    { id: 'disc', parent: 'doe', name: 'Model discrimination', off: { x: 0, y: -108 }, roles: 'gsd',
      kind: 'Which model is right?',
      have: 'Rival models f₁, f₂, … and data.',
      want: 'The model the data support, the experiment that best separates the rivals, and which parameters are identifiable at all.',
      obj: 'max_x  divergence between f₁(x) and f₂(x);  then AIC / BIC / likelihood ratio',
      discopt: [dd('model-discrimination', 'discopt-doe: model discrimination'), dd('identifiability-estimability', 'discopt-doe: identifiability and estimability')],
      difflow: [] },
    { id: 'robust', parent: 'opt', name: 'Under uncertainty', off: { x: 240, y: -22 }, roles: 'suc',
      kind: 'Robust and stochastic optimization',
      have: 'A distribution or uncertainty set for θ, from UQ.',
      want: 'Decisions that are best on average, or stay feasible in every scenario.',
      obj: 'min_x  E_θ[g(x, θ)]   or   min_x max_{θ∈U} g(x, θ)',
      discopt: [dc('stochastic_programming', 'Stochastic programming'), dc('tutorial_robust', 'Robust optimization'),
                dc('robust_adjustable', 'Adjustable robust optimization')],
      difflow: [df('32_stochastic_ree_separation', '32 Stochastic Nd/Dy separation')] },
    { id: 'hybrid', parent: 'est', name: 'Hybrid models', off: { x: 82, y: 84 }, roles: 'dsd',
      kind: 'Learn the missing physics',
      have: 'Conservation laws with an unknown term (a rate, a closure) and data.',
      want: 'A neural or symbolic term trained through the solver, so the hybrid model is still differentiable.',
      obj: 'min_w  loss(y, f(x; θ, NN_w(x)))',
      discopt: [dc('neural_dae', 'Training neural DAEs'), dc('decision_focused_learning', 'Decision-focused learning')],
      difflow: [] },
    { id: 'surr', parent: 'sim', name: 'Surrogates', off: { x: 228, y: 30 }, roles: 'ggs',
      kind: 'A cheaper f with uncertainty',
      have: 'An expensive simulation or experiments, sampled.',
      want: 'A fast, differentiable approximation with calibrated uncertainty that drops back in as a unit or a constraint.',
      obj: 'min_w  Σ ‖f(x; θ) − f̂_w(x)‖²',
      discopt: [dc('nn_embedding', 'Neural network embedding')],
      difflow: [df('13_surrogate_pump', '13 Surrogate pump')] },
    { id: 'flex', parent: 'uq', name: 'Flexibility', off: { x: -40, y: 104 }, roles: 'gus',
      kind: 'Flexibility and operability',
      have: 'A design, and ranges for disturbances and uncertain parameters.',
      want: 'Whether the design stays feasible, and controllable, over the whole range.',
      obj: 'max_θ∈T  min_z  max_j  h_j(x, z, θ)  ≤ 0',
      discopt: [],
      difflow: [dfdoc('flexibility', 'Flexibility analysis')], difflowNote: 'No notebook yet.' },
    { id: 'fault', parent: 'rec', name: 'Fault detection', off: { x: 112, y: -100 }, roles: 'dgs',
      kind: 'What broke?',
      have: 'Reconciliation residuals over time.',
      want: 'Which sensor drifted or which unit failed, with a statistical test behind it.',
      obj: 'test  (ŷ − y)/σ  against χ²',
      discopt: [],
      difflow: [df('28_data_reconciliation', '28 Data reconciliation (gross-error detection)')],
      difflowNote: 'Gross errors only. No diagnosis of unit faults yet.' },
  ];

  T.forEach(t => Object.assign(t, at(t.deg), { w: TW, h: TH, group: t.id }));
  const byId = Object.fromEntries(T.map(t => [t.id, t]));
  S.forEach(s => { const p = byId[s.parent];
    Object.assign(s, { x: p.x + s.off.x, y: p.y + s.off.y, w: SW, h: SH, group: p.id, sat: true }); });
  const MODEL = { id: 'model', name: 'Model  f(x; θ)', x: C.x, y: C.y, w: MW, h: MH, group: 'model',
    kind: 'Write it once, ask it many questions',
    have: 'x: what you set or measure (inputs, conditions, decisions). θ: parameters (rate constants, efficiencies, coefficients). y = f(x; θ): outputs and states.',
    want: 'One model reused by every task around it, like a digital twin. Each task only changes which of x, θ, y are fixed, which are free, and what objective is attached.',
    obj: 'exact ∂y/∂x, ∂y/∂θ, and derivatives through the solve',
    discopt: [dc('cstr_fit_doe_optimize', 'One model, four jobs'), dc('model_derivatives', 'Derivatives of models'),
              dc('implicit_function_node', 'Implicit-function node')],
    difflow: [df('00_cstr_pfr_basics', '00 CSTR and PFR basics'), df('02_cstr_sensitivity', '02 Differentiable CSTR')] };
  const ALL = [MODEL, ...T, ...S];
  ALL.forEach(n => (byId[n.id] = n));

  // ---------- drawing helpers ----------
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  // "min_θ" and "Σ_θ" set the next character as a subscript
  const txt = (s, attrs, parent) => {
    const t = el('text', attrs, parent);
    s.split(/(_\S)/).forEach(part => {
      if (part.startsWith('_')) {
        el('tspan', { dy: 4, 'font-size': '75%' }, t).textContent = part[1];
        el('tspan', { dy: -4 }, t).textContent = ' ';
      } else if (part) t.appendChild(document.createTextNode(part));
    });
    return t;
  };
  const v = name => `var(--${name})`;
  const defs = document.getElementById('defs');
  [...T.map(t => t.id), 'model'].forEach(g =>
    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: v(g) },
      el('marker', { id: `arr-${g}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs)));

  // where the ray from a's center toward b leaves a's box
  const exitPt = (a, bx, by, pad = 0) => {
    const dx = bx - a.x, dy = by - a.y;
    const s = Math.min((a.w / 2 + pad) / Math.abs(dx || 1e-9), (a.h / 2 + pad) / Math.abs(dy || 1e-9));
    return { x: a.x + dx * s, y: a.y + dy * s };
  };

  const edgeG = document.getElementById('edges');
  const nodeG = document.getElementById('nodes');

  // model → task edges, labelled as in the sketch
  T.forEach(t => {
    const p0 = exitPt(MODEL, t.x, t.y, 4), p1 = exitPt(t, C.x, C.y, 6);
    el('path', { d: `M ${p0.x} ${p0.y} L ${p1.x} ${p1.y}`, class: 'edge', stroke: v(t.id),
                 'marker-end': `url(#arr-${t.id})`, 'data-a': 'model', 'data-b': t.id }, edgeG);
    // label beside the line's midpoint, pushed off it along the normal
    const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
    let nx = -(p1.y - p0.y), ny = p1.x - p0.x;
    const L = Math.hypot(nx, ny); nx /= L; ny /= L;
    if (ny > 0 || (Math.abs(ny) < 1e-6 && nx < 0)) { nx = -nx; ny = -ny; }   // keep labels above / right
    const lx = mx + nx * 16, ly = my + ny * 16 + 4;
    const anchor = Math.abs(nx) < .3 ? 'middle' : nx > 0 ? 'start' : 'end';
    txt(t.edge, { x: lx, y: ly, 'text-anchor': anchor, class: 'elbl math', style: `fill:${v(t.id)}`,
                  'data-a': 'model', 'data-b': t.id }, edgeG);
  });
  // satellite tethers
  S.forEach(s => {
    const p = byId[s.parent];
    const p0 = exitPt(p, s.x, s.y, 2), p1 = exitPt(s, p.x, p.y, 2);
    el('path', { d: `M ${p0.x} ${p0.y} L ${p1.x} ${p1.y}`, class: 'tether', stroke: v(p.id),
                 'data-a': p.id, 'data-b': s.id }, edgeG);
  });

  // x θ y chips; their style shows the role each plays in the task
  const chips = (g, roles, cx, cy, accent, r = 13) => {
    ['x', 'θ', 'y'].forEach((sym, i) => {
      const role = roles[i], x = cx + (i - 1) * (r * 2 + 10);
      const a = { cx: x, cy, r };
      let fill = 'none', stroke = v('muted'), tf = v('ink'), extra = {};
      if (role === 'g') { fill = v('ink'); stroke = v('ink'); tf = v('bg'); }
      if (role === 'd') { fill = v('data'); stroke = v('data'); tf = v('bg'); }
      if (role === 's') { fill = v('card'); stroke = accent; tf = accent; extra = { 'stroke-width': 2.6 }; }
      if (role === 'u') { stroke = v('ink'); extra = { 'stroke-dasharray': '3 2.5', 'stroke-width': 1.6 }; }
      if (role === 'c') { stroke = v('rule'); tf = v('muted'); }
      el('circle', { ...a, fill, stroke, 'stroke-width': 1.4, ...extra }, g);
      const t = el('text', { x, y: cy + 5, class: 'chip-txt math', style: `fill:${tf};font-weight:${role === 's' ? 700 : 500}` }, g);
      t.textContent = sym;
      el('title', {}, g).textContent = `${sym}: ${ROLE[role]}`;
    });
  };

  // model box
  {
    const g = el('g', { class: 'node', id: 'n-model', transform: `translate(${C.x} ${C.y})`, tabindex: 0, role: 'button', 'aria-label': 'The model f(x; θ)' }, nodeG);
    MODEL.g = g;
    el('rect', { x: -MW / 2, y: -MH / 2, width: MW, height: MH, rx: 10, class: 'card', fill: v('model-soft'), stroke: v('model'), 'stroke-width': 3 }, g);
    const t1 = el('text', { x: 0, y: -26, 'text-anchor': 'middle', style: `font-size:20px;font-weight:650;fill:${v('model')}` }, g);
    t1.textContent = 'Model';
    const t2 = el('text', { x: 0, y: 14, 'text-anchor': 'middle', class: 'math', style: `font-size:30px;fill:${v('model')}` }, g);
    t2.textContent = 'f(x; θ)';
    const t3 = el('text', { x: 0, y: 48, 'text-anchor': 'middle', class: 'lbl' }, g);
    t3.textContent = 'differentiable · written once';
  }

  // task cards and satellites
  [...T, ...S].forEach(n => {
    const g = el('g', { class: `node${n.sat ? ' sat' : ''}`, id: `n-${n.id}`, transform: `translate(${n.x} ${n.y})`,
                        tabindex: 0, role: 'button', 'aria-label': `${n.name}: ${n.kind}` }, nodeG);
    n.g = g;
    const acc = v(n.group);
    el('rect', { x: -n.w / 2, y: -n.h / 2, width: n.w, height: n.h, rx: n.sat ? n.h / 2 : 22, class: 'card',
                 fill: n.sat ? v('card') : v(`${n.group}-soft`), stroke: acc }, g);
    if (n.sat) {
      const t = el('text', { x: 0, y: 5, 'text-anchor': 'middle', class: 'name', style: `font-size:14.5px;fill:${acc}` }, g);
      t.textContent = n.name;
    } else {
      const t = el('text', { x: 0, y: -14, 'text-anchor': 'middle', class: 'name', style: `fill:${acc}` }, g);
      t.textContent = n.name;
      chips(g, n.roles, 0, 22, acc);
    }
  });

  // ---------- legend ----------
  {
    const g = document.getElementById('legend');
    const L = el('g', { transform: 'translate(24 566)' }, g);
    const h = el('text', { x: 0, y: 0, class: 'lbl', style: 'font-weight:650' }, L);
    h.textContent = 'In each task, x, θ and y are';
    [['g', 'given'], ['d', 'from data'], ['s', 'sought'], ['u', 'uncertain'], ['c', 'computed']].forEach(([r, label], i) => {
      const row = el('g', { transform: `translate(14 ${24 + i * 26})` }, L);
      chips(row, r === 's' ? 'csc' : r.repeat(3), 0, 0, v('model'), 9);
      // keep only the middle chip of the three
      [...row.children].forEach((c, k) => { if (k < 3 || k > 5) c.remove(); });
      const t = el('text', { x: 22, y: 4.5, class: 'lbl' }, row);
      t.textContent = label;
    });
    const sat = el('g', { transform: 'translate(0 166)' }, L);
    el('rect', { x: 0, y: -11, width: 26, height: 20, rx: 10, fill: 'none', stroke: v('muted'), 'stroke-dasharray': '5 4', 'stroke-width': 1.4 }, sat);
    const st = el('text', { x: 36, y: 4, class: 'lbl' }, sat);
    st.textContent = 'related task to cover';
  }

  // ---------- the digital-twin loop ----------
  const LOOP = [
    ['rec', 'reconcile data'], ['est', 'calibrate θ'], ['uq', 'quantify UQ'],
    ['doe', 'design experiment'], ['opt', 'optimize'], ['ctl', 'control'], ['plan', 'plan'],
  ];
  {
    const g = document.getElementById('loop');
    const y = 806, w = 150, gap = 22, x0 = C.x - (LOOP.length * w + (LOOP.length - 1) * gap) / 2;
    const title = el('text', { x: C.x, y: y - 36, 'text-anchor': 'middle', class: 'lbl', style: 'font-weight:650' }, g);
    title.textContent = 'The digital-twin loop: new data go back to reconciliation, and the same model is reused at every step';
    LOOP.forEach(([id, label], i) => {
      const x = x0 + i * (w + gap);
      const s = el('g', { class: 'loop-step', 'data-step': id, tabindex: 0, role: 'button', 'aria-label': `Step ${i + 1}: ${label}` }, g);
      el('rect', { x, y: y - 18, width: w, height: 36, rx: 18, fill: v(`${id}-soft`), stroke: v(id), 'stroke-width': 1.4 }, s);
      const t = el('text', { x: x + w / 2, y: y + 4.5, 'text-anchor': 'middle', style: `font-size:13px;font-weight:600;fill:${v(id)}` }, s);
      t.textContent = `${i + 1}. ${label}`;
      if (i < LOOP.length - 1)
        el('path', { d: `M ${x + w + 4} ${y} l ${gap - 9} 0`, stroke: v('muted'), 'stroke-width': 1.6, fill: 'none', 'marker-end': 'url(#arr-model)' }, g);
    });
    // return arrow from the last step back to the first
    const xl = x0 + LOOP.length * w + (LOOP.length - 1) * gap;
    el('path', { d: `M ${xl - w / 2} ${y + 18} q 0 22 -22 22 L ${x0 + w / 2 + 22} ${y + 40} q -22 0 -22 -16`,
                 stroke: v('muted'), 'stroke-width': 1.4, fill: 'none', 'stroke-dasharray': '4 4', 'marker-end': 'url(#arr-model)' }, g);
  }

  // ---------- interaction ----------
  const svg = document.getElementById('map');
  const tip = document.getElementById('tip');
  const wrap = document.getElementById('wrap');
  let pinned = null, hideTimer = null;

  const highlight = id => {
    svg.classList.add('focus');
    const lit = new Set([id]);
    svg.querySelectorAll('[data-a]').forEach(e => {
      if (e.dataset.a === id || e.dataset.b === id) {
        e.classList.add('lit'); lit.add(e.dataset.a); lit.add(e.dataset.b);
      }
    });
    // the model lights everything
    if (id === 'model') ALL.forEach(n => lit.add(n.id));
    ALL.forEach(n => n.g.classList.toggle('lit', lit.has(n.id)));
  };
  const unhighlight = () => {
    svg.classList.remove('focus');
    svg.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
  };

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sub = s => esc(s).replace(/_(\S)/g, '<sub>$1</sub>');
  const list = (items, note, repo) => {
    const li = items.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`).join('');
    const gap = items.length ? '' : `<li class="gap">None yet: a notebook to write.</li>`;
    return `<h4>${repo}</h4><ul>${li}${gap}${note ? `<li class="gap">${esc(note)}</li>` : ''}</ul>`;
  };
  const show = n => {
    clearTimeout(hideTimer);
    tip.style.setProperty('--accent', v(n.group));
    const roles = n.roles ? ['x', 'θ', 'y'].map((s, i) => `${s} ${ROLE[n.roles[i]]}`).join(' · ') : '';
    tip.innerHTML = `<div class="t-name">${esc(n.name)}</div>
      <div class="t-kind">${esc(n.kind)}${n.sat ? ' · related task' : ''}</div>
      <dl><dt>You have</dt><dd>${esc(n.have)}</dd>
          <dt>You want</dt><dd>${esc(n.want)}</dd>
          <dt>${n.id === 'model' ? 'Gives' : 'Solve'}</dt><dd class="t-obj">${sub(n.obj)}</dd>
          ${roles ? `<dt>Roles</dt><dd>${roles}</dd>` : ''}</dl>
      ${list(n.discopt, n.discoptNote, 'discopt')}
      ${list(n.difflow, n.difflowNote, 'difflow')}`;
    tip.classList.add('show');
    const r = n.g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left - w.left + r.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, w.width - tw - 8));
    let top = r.bottom - w.top + 8;
    if (top + th > w.height && r.top - w.top - th - 8 > 0) top = r.top - w.top - th - 8;
    tip.style.left = `${left}px`; tip.style.top = `${Math.max(0, top)}px`;
    ALL.forEach(m => m.g.classList.toggle('active', m === n));
    highlight(n.id);
  };
  const hide = () => {
    if (pinned) return;
    hideTimer = setTimeout(() => {
      tip.classList.remove('show');
      ALL.forEach(m => m.g.classList.remove('active'));
      unhighlight();
    }, 180);
  };

  ALL.forEach(n => {
    n.g.addEventListener('mouseenter', () => { if (!pinned) show(n); });
    n.g.addEventListener('mouseleave', hide);
    n.g.addEventListener('focus', () => { if (!pinned) show(n); });
    n.g.addEventListener('blur', hide);
    n.g.addEventListener('click', e => {
      e.stopPropagation();
      pinned = pinned === n ? null : n;
      show(n);
    });
    n.g.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinned = n; show(n); }
    });
  });
  tip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  tip.addEventListener('mouseleave', hide);
  const steps = [...svg.querySelectorAll('.loop-step')];
  const unpin = () => {
    pinned = null; tip.classList.remove('show');
    ALL.forEach(m => m.g.classList.remove('active')); steps.forEach(s => s.classList.remove('on'));
    unhighlight();
  };
  document.addEventListener('click', e => { if (!tip.contains(e.target)) unpin(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });

  // a loop step pins its task, so you can walk the loop by clicking along it
  steps.forEach(s => {
    const go = e => {
      e.stopPropagation();
      steps.forEach(x => x.classList.toggle('on', x === s));
      pinned = byId[s.dataset.step]; show(pinned);
    };
    s.addEventListener('click', go);
    s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } });
  });
})();
</script>
</body>
</html>
