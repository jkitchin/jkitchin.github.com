project:
  type: website
  output-dir: _site
  # Only render the new site. legacy/ holds the frozen blogofile output and is
  # copied in verbatim by scripts/merge_legacy.py after rendering.
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.ipynb"
  resources:
    - CNAME
    - "assets/**"
  pre-render: python3 scripts/prerender.py
  post-render:
    - python3 scripts/merge_legacy.py
    - python3 scripts/build_ask_index.py

website:
  title: "Kitchin Research Group"
  site-url: "https://kitchingroup.cheme.cmu.edu"
  description: "Chemical Engineering at Carnegie Mellon University"
  favicon: legacy/favicon.ico
  search: true
  google-analytics: "G-PH8NF4F0RE"  # same GA4 property as the legacy pages
  page-navigation: false
  navbar:
    left:
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Software
        href: software.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Posts
        href: posts/index.qmd
      - text: Archive
        href: /blog/
    right:
      - icon: rss
        href: posts/index.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/jkitchin
        aria-label: GitHub
  page-footer:
    left: "John Kitchin · Department of Chemical Engineering, Carnegie Mellon University"
    right: "Posts 2009-2025: [archive](/blog/)"

format:
  html:
    theme:
      light: [cosmo, theme/kitchin.scss]
      dark: [cosmo, theme/kitchin.scss, theme/kitchin-dark.scss]
    respect-user-color-scheme: true
    toc: false
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: github-dark
    smooth-scroll: true
    link-external-newwindow: false
    email-obfuscation: javascript
    # Ask widget (assets/ask/): BM25 search plus optional in-browser WebLLM answers.
    include-after-body:
      text: '<script defer src="/assets/ask/ask.js" id="site-ask" data-index="/ask-index.json" data-root="/"></script>'

execute:
  # Computations run on your machine; their results are stored in _freeze/
  # and committed, so CI never re-executes code.
  freeze: auto
